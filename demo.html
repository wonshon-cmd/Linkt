button class=\"btn full\" id=\"pp-face\">🙂 Use Face ID<\/button>' +\n          '<div class=\"or\">or a code sent to •••• ' + PATIENT.phone.slice(-4) + '<\/div>' +\n          '<div class=\"fine\">🔒 Encrypted · auto sign-out after 15 min<\/div>';\n        return;\n      }\n      var s = state || {}, d = s.drugText ? findDrug(s.drugText) : null, txt = s.textConsent !== false;\n      p.innerHTML = '<button class=\"pp-back\" data-back>‹ Texts<\/button><div class=\"pp-title\">Hi ' + PATIENT.first + '<\/div>' +\n        (d ? '<div class=\"pp-card\"><b>' + d.brand + ' ' + strength(d) + '<\/b><div class=\"muted\">from ' + DOCTOR.name + '<\/div>' +\n          '<div>' + (s.status ? stageName(s, s.status) : \"\") + '<\/div>' +\n          (s.expires ? '<div class=\"muted\">Insurance approval valid until ' + s.expires + '<\/div>' : '') +\n          '<div class=\"muted\">' + PHARMACY.name + ' · copay $' + PATIENT.copay + '<\/div><\/div>' : '<div class=\"pp-card muted\">No prescriptions yet<\/div>') +\n        '<div class=\"pp-sub\">My consents<\/div>' +\n        '<label class=\"pp-row\"><span>Text updates<\/span><input type=\"checkbox\" id=\"pp-text\"' + (txt ? \" checked\" : \"\") + '><\/label>' +\n        '<div class=\"pp-row\"><span>Share with my care team for treatment<\/span><span class=\"muted\">Allowed by HIPAA<\/span><\/div>' +\n        '<div class=\"pp-sub\">My rights<\/div>' +\n        '<div class=\"pp-acts\"><button class=\"portal-btn\" data-req=\"a copy of my records\">Get a copy of my records<\/button><button class=\"portal-btn\" data-req=\"a list of who my information was shared with\">Who it was shared with<\/button><button class=\"portal-btn\" data-req=\"a correction\">Ask for a correction<\/button><\/div>' +\n        '<div class=\"pp-sub\">Who viewed my information<\/div>' +\n        readAudit().slice().reverse().map(function (r) { return '<div class=\"pp-log\"><b>' + r.who + '<\/b> · ' + r.org + '<div class=\"muted\">' + r.t + ' · ' + r.action + '<\/div><\/div>'; }).join(\"\");\n    }\n    $(\"portal-btn\").addEventListener(\"click\", function () { $(\"pportal\").classList.remove(\"hidden\"); portalView(); });\n    $(\"pportal\").addEventListener(\"click\", async function (e) {\n      if (e.target.closest(\"[data-back]\")) { $(\"pportal\").classList.add(\"hidden\"); return; }\n      var rq = e.target.closest(\"[data-req]\");\n      if (rq) { logAccess(\"patient\", \"Requested \" + rq.dataset.req); toast(\"✓ Request sent · by law you'll hear back within 30 days\"); return; }\n      if (e.target.id === \"pp-face\") {\n        e.target.textContent = \"Looking for your face…\";\n        await wait(1100);\n        authed = true;\n        logAccess(\"patient\", \"Viewed own record in the patient portal\");\n        portalView();\n      }\n    });\n    $(\"pportal\").addEventListener(\"change\", function (e) {\n      if (e.target.id !== \"pp-text\") return;\n      var on = e.target.checked;\n      state = update(function (s) {\n        s.textConsent = on;\n        post(s, \"system\", PATIENT.first + \" turned text updates \" + (on ? \"on\" : \"off\") + \" in the patient portal\");\n      }, state);\n      logAccess(\"patient\", \"Changed consent · text updates \" + (on ? \"ON\" : \"OFF\"));\n      toast(on ? \"📱 Text updates on\" : \"🚫 Text updates off · you can turn them back on anytime\");\n    });\n\n    // Patient (or caregiver) texts a reading → logged for the NP\n    var mine = [];\n    $(\"sms-send\").addEventListener(\"submit\", function (e) {\n      e.preventDefault();\n      var t = $(\"sms-in\").value.trim();\n      if (!t) return;\n      $(\"sms-in\").value = \"\";\n      var v = {}, bp = t.match(/(\\d{2,3})\\s*\\/\\s*(\\d{2,3})/), g = t.match(/(?:sugar|glucose|bs)\\D*(\\d{2,3})/i), w = t.match(/(?:weight|wt)\\D*(\\d{2,3})/i);\n      if (bp) v.bp = bp[1] + \"/\" + bp[2]; if (g) v.glu = g[1]; if (w) v.wt = w[1];\n      var alerts = [];\n      if (v.bp && +bp[1] >= LIMITS.bpSys) alerts.push(\"Blood pressure \" + v.bp + \" (high)\");\n      if (v.glu && +v.glu >= LIMITS.glu) alerts.push(\"Glucose \" + v.glu + \" (high)\");\n      mine.push({ me: t, reply: Object.keys(v).length ? \"Linkt: Got it. Your nurse practitioner will see it\" + (alerts.length ? \" today. If you feel unwell, call 911.\" : \".\") : \"Linkt: Sorry, we couldn't read a number. Try “BP 150/90” or “sugar 180”.\" });\n      if (Object.keys(v).length) {\n        var a = []; try { a = JSON.parse(localStorage.getItem(READINGS_KEY)) || []; } catch (x) {}\n        a.push({ pt: PATIENT.name, id: \"maria\", by: PATIENT.first + \" (texted)\", via: \"text\", t: clock(), vals: v, alerts: alerts });\n        localStorage.setItem(READINGS_KEY, JSON.stringify(a));\n        logAccess(\"patient\", \"Texted a reading: \" + t);\n      }\n      render(readStore());\n    });\n\n    $(\"pt-title\").textContent = PATIENT.first + \"'s phone\";\n    $(\"phone-clock\").textContent = clock();\n    var s0 = loadState();\n    render(s0);\n    window.addEventListener(\"storage\", function (e) {\n      if (e.key !== PRETEXT_KEY) return;\n      render(readStore());\n      toast(\"📱 New text from <b>HomeFirst<\/b>\");\n    });\n    onStateChange(function (s) {\n      var before = (state && state.texts || []).length;\n      render(s);\n      if (!$(\"pportal\").classList.contains(\"hidden\")) portalView();\n      if ((s.texts || []).length > before) toast(\"📱 New text from <b>Linkt<\/b>\");\n    });\n  "}, "doctor": {"label": "Clinic", "ic": "🏥", "phone": false, "cls": "", "title": "Linkt Prescriber Portal", "body": "\n\n  <header class=\"topbar\">\n    <div class=\"brand\"><span class=\"logo\"><\/span> Linkt <span class=\"role-tag\">for Clinics<\/span><\/div>\n    <nav class=\"nav\"><a>Patients<\/a><a class=\"on\">Prescriptions<\/a><a>Prior auths<\/a><a>Messages<\/a><\/nav>\n    <div class=\"who\" id=\"who\"><\/div>\n    <a class=\"restart\" href=\"#\" data-reset>↺ Reset<\/a>\n  <\/header>\n\n  <main class=\"page\">\n    <!-- Prior auths about to expire: renew before the patient runs out -->\n    <div class=\"card renew\" id=\"renew\">\n      <div class=\"renew-head\"><b>⏰ Prior auths expiring soon<\/b><span class=\"muted\">We remind you 30 days ahead, so patients never run out.<\/span><\/div>\n      <div id=\"renew-rows\"><\/div>\n      <input type=\"file\" id=\"renew-input\" accept=\"image/*,.pdf\" multiple hidden>\n    <\/div>\n\n    <div class=\"two-col\">\n      <div class=\"stack\">\n        <!-- 1. Patient: photo of the facesheet fills the chart -->\n        <div class=\"card pad\">\n          <div class=\"card-title\">1 · Patient<\/div>\n          <div id=\"pt-capture\">\n            <label class=\"drop\">\n              <input type=\"file\" id=\"face-input\" accept=\"image/*\" capture=\"environment\" hidden>\n              <span class=\"drop-ic\">📷<\/span>\n              <span><b>Take a photo of the facesheet<\/b><br><span class=\"muted\">or the insurance card · AI fills in the chart<\/span><\/span>\n            <\/label>\n            <div class=\"link-row\">\n              <button class=\"link-btn\" id=\"face-sample\" type=\"button\">Use sample facesheet<\/button>\n              <button class=\"link-btn\" id=\"face-type\" type=\"button\">Type it in instead<\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"scan hidden\" id=\"pt-scan\">\n            <div class=\"scan-img\" id=\"scan-img\"><\/div>\n            <div class=\"scan-bar\"><\/div>\n          <\/div>\n          <div class=\"ai-log muted\" id=\"scan-log\"><\/div>\n\n          <div class=\"hidden\" id=\"pt-form\">\n            <div class=\"patient\">\n              <div class=\"avatar\" id=\"pt-av\"><\/div>\n              <div>\n                <div class=\"patient-name\" id=\"pt-name\"><\/div>\n                <div class=\"muted\" id=\"pt-meta\"><\/div>\n              <\/div>\n            <\/div>\n            <div class=\"fields\" id=\"pt-fields\"><\/div>\n\n            <div class=\"consent\" id=\"consent\">\n              <div class=\"card-title\">Patient consent<\/div>\n              <label class=\"ck\"><input type=\"checkbox\" id=\"c-text\" checked> <span><b>Text me prescription updates<\/b> <span class=\"muted\">· opt-in, reply STOP anytime<\/span><\/span><\/label>\n              <label class=\"ck\"><input type=\"checkbox\" id=\"c-npp\" checked> <span><b>Received the Notice of Privacy Practices<\/b><\/span><\/label>\n              <div class=\"fine left\">No signature needed to share with the health plan and pharmacy. HIPAA allows it for treatment and payment.<\/div>\n              <button class=\"btn\" id=\"c-sign\" type=\"button\">✍️ Patient signs on tablet<\/button>\n              <div class=\"consent-done hidden\" id=\"c-done\"><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- 2. Medication -->\n        <div class=\"card pad\">\n          <div class=\"card-title\">2 · New prescription<\/div>\n          <label class=\"field-label\">Medication<\/label>\n          <form id=\"drug-form\" class=\"drug-form\">\n            <input id=\"drug-input\" type=\"text\" placeholder=\"Type any medication…\" autocomplete=\"off\">\n            <button type=\"submit\" class=\"btn\">Add<\/button>\n          <\/form>\n          <div class=\"chips\" id=\"chips\"><\/div>\n          <div class=\"rx-line hidden\" id=\"rx-line\">\n            <div><span class=\"muted\">Dose<\/span><b id=\"rx-dose\"><\/b><\/div>\n            <div><span class=\"muted\">Send to<\/span><b id=\"rx-pharm\"><\/b><\/div>\n            <div><span class=\"muted\">Updates to patient<\/span><b id=\"rx-text\">📱 Text · consented<\/b><\/div>\n          <\/div>\n        <\/div>\n\n        <!-- 3. Records: photos or files, AI pulls out the values -->\n        <div class=\"card pad\">\n          <div class=\"card-title\">3 · Supporting records<\/div>\n          <label class=\"drop\" id=\"drop\">\n            <input type=\"file\" id=\"file-input\" accept=\"image/*,.pdf\" multiple hidden>\n            <span class=\"drop-ic\">📄<\/span>\n            <span><b>Snap or drop labs, notes, med lists<\/b><br><span class=\"muted\">AI reads values like A1c for you<\/span><\/span>\n          <\/label>\n          <div class=\"link-row\">\n            <button class=\"link-btn\" id=\"sample-btn\" type=\"button\">Use sample records<\/button>\n            <button class=\"link-btn\" id=\"type-btn\" type=\"button\">+ Type a value<\/button>\n          <\/div>\n          <form class=\"type-val hidden\" id=\"type-form\">\n            <input id=\"tv-name\" placeholder=\"e.g. A1c\" autocomplete=\"off\">\n            <input id=\"tv-val\" placeholder=\"e.g. 8.1%\" autocomplete=\"off\">\n            <button class=\"btn\">Add<\/button>\n          <\/form>\n          <ul class=\"files\" id=\"files\"><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"card pad req\">\n        <div class=\"empty\" id=\"req-empty\">\n          <div class=\"empty-ic\">🛡️<\/div>\n          <div>Add a patient and a medication to see what their plan needs to approve it.<\/div>\n        <\/div>\n\n        <div class=\"hidden\" id=\"req-body\">\n          <div class=\"card-title\" id=\"req-title\"><\/div>\n          <div class=\"req-head\" id=\"req-head\"><\/div>\n          <ul class=\"rules\" id=\"rules\"><\/ul>\n          <div class=\"ai-log muted\" id=\"ai-log\"><\/div>\n          <button class=\"btn btn-big full\" id=\"check-btn\" disabled><\/button>\n\n          <div class=\"sign hidden\" id=\"sign\">\n            <div class=\"verdict\" id=\"doc-verdict\"><\/div>\n            <div class=\"card-title send-title\">Send to Aetna by<\/div>\n            <div class=\"methods\" id=\"methods\"><\/div>\n            <div class=\"sig-box\"><span class=\"sig\" id=\"sig\"><\/span><span class=\"sig-line\">Dr. Anita Shah · I confirm this medication is medically necessary.<\/span><\/div>\n            <button class=\"btn btn-big full\" id=\"sign-btn\">Dr. Shah: e-sign &amp; send<\/button>\n            <div class=\"sent hidden\" id=\"sent\">\n              <div><b class=\"accent\">41 sec<\/b> <span class=\"muted\">of staff time · usually 18 min<\/span><\/div>\n              <div class=\"card-title\">Where's the script?<\/div>\n              <ol class=\"track\" id=\"track\"><\/ol>\n              <a class=\"btn\" id=\"to-payer\" target=\"linkt_insurer\">Sent to Aetna ↗<\/a>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <!-- AI phone call to the plan -->\n  <div class=\"modal hidden\" id=\"call\">\n    <div class=\"modal-card\">\n      <div class=\"call-head\"><span class=\"call-dot\"><\/span><b id=\"call-title\">Calling Aetna PA line<\/b><span class=\"muted\" id=\"call-time\">0:00<\/span><\/div>\n      <div class=\"call-log\" id=\"call-log\"><\/div>\n      <div class=\"fine left\">The AI says it's an automated assistant and that the call is recorded. If Aetna asks for a peer-to-peer review, Dr. Shah takes that call herself.<\/div>\n      <button class=\"btn full hidden\" id=\"call-done\">Done · save to chart<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- Ask Linkt AI -->\n  <div class=\"chat\" id=\"chat\">\n    <button class=\"chat-toggle\" id=\"chat-toggle\">💬 Ask Linkt AI<\/button>\n    <div class=\"chat-panel\">\n      <div class=\"chat-head\"><b>Linkt AI<\/b><span class=\"muted\"> · ask about this prior auth<\/span><button class=\"chat-x\" id=\"chat-x\">×<\/button><\/div>\n      <div class=\"chat-msgs\" id=\"chat-msgs\"><\/div>\n      <div class=\"chips chat-chips\" id=\"q-chips\"><\/div>\n      <form class=\"chat-form\" id=\"chat-form\"><input id=\"chat-input\" placeholder=\"Ask a question…\" autocomplete=\"off\"><button class=\"btn\">↑<\/button><\/form>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "// Prescriber portal: MA snaps the facesheet (AI fills the chart), patient consents on a tablet,\n// records are read for values like A1c, AI checks the plan's rules, the doctor e-signs and\n// it goes to the plan by ePA, auto-fax, print or an AI phone call. Expiring PAs get renewed here.\n\nvar drug = null, files = [], checked = false, ptReady = false, method = \"epa\", consentSigned = false;\n\n// ---------- 1. Patient: facesheet photo → chart ----------\nfunction sampleSheet() {\n  return '<div class=\"sheet\"><div class=\"sheet-hd\"><b>RIVERSIDE FAMILY MEDICINE<\/b><span>PATIENT FACESHEET<\/span><\/div>' +\n    FACESHEET.map(function (f) { return '<div><span>' + f[1] + '<\/span>' + f[2] + '<\/div>'; }).join(\"\") + '<\/div>';\n}\n\nasync function scan(imgUrl) {\n  $(\"pt-capture\").classList.add(\"hidden\");\n  $(\"pt-scan\").classList.remove(\"hidden\");\n  $(\"scan-img\").innerHTML = imgUrl ? '<img src=\"' + imgUrl + '\" alt=\"Facesheet photo\">' : sampleSheet();\n  var log = $(\"scan-log\");\n  log.textContent = \"Reading the facesheet…\";\n  await wait(1200);\n  log.textContent = \"Found \" + FACESHEET.length + \" fields · matching to the chart…\";\n  await wait(700);\n  showForm(true);\n  var inputs = document.querySelectorAll(\"#pt-fields input\");\n  for (var i = 0; i < FACESHEET.length; i++) {\n    inputs[i].value = FACESHEET[i][2];\n    inputs[i].parentNode.classList.add(\"filled\");\n    syncPatient();\n    await wait(110);\n  }\n  log.innerHTML = \"✨ Filled \" + FACESHEET.length + \" of \" + FACESHEET.length + \" fields from one photo · please check, then tap a field to fix it\";\n  $(\"pt-scan\").classList.add(\"hidden\");\n  logAccess(\"doctor\", \"Scanned facesheet · created chart for \" + PATIENT.name);\n  logAccess(\"doctor\", \"📸 Facesheet photo stored encrypted in the chart · not on the camera roll\");\n  if (imgUrl) URL.revokeObjectURL(imgUrl);   // drop the phone's temporary copy\n  $(\"scan-log\").insertAdjacentHTML(\"beforeend\", '<div class=\"media-chip\">🔒 Photo stored encrypted in the chart, not in the phone\\'s photos<\/div>');\n}\n\nfunction showForm() {\n  $(\"pt-capture\").classList.add(\"hidden\");\n  $(\"pt-form\").classList.remove(\"hidden\");\n  $(\"pt-fields\").innerHTML = FACESHEET.map(function (f) {\n    var wide = /address|problems|meds|contact/.test(f[0]) ? \" wide\" : \"\";\n    return '<label class=\"fld' + wide + '\"><span>' + f[1] + '<\/span><input data-k=\"' + f[0] + '\" autocomplete=\"off\"><\/label>';\n  }).join(\"\");\n  $(\"pt-fields\").addEventListener(\"input\", syncPatient);\n}\n\nfunction val(k) { var el = document.querySelector('#pt-fields [data-k=\"' + k + '\"]'); return el ? el.value.trim() : \"\"; }\n\nfunction syncPatient() {\n  var name = val(\"name\");\n  if (name) {\n    PATIENT.name = name;\n    PATIENT.first = name.split(\" \")[0];\n  }\n  if (val(\"dob\")) PATIENT.dob = val(\"dob\");\n  if (val(\"phone\")) PATIENT.phone = val(\"phone\");\n  if (val(\"plan\")) PATIENT.plan = val(\"plan\");\n  if (val(\"memberId\")) PATIENT.memberId = val(\"memberId\");\n  $(\"pt-av\").textContent = name ? name.split(\" \").map(function (w) { return w[0]; }).join(\"\").slice(0, 2).toUpperCase() : \"?\";\n  $(\"pt-name\").textContent = name || \"New patient\";\n  $(\"pt-meta\").textContent = [val(\"dob\") && \"DOB \" + val(\"dob\"), val(\"plan\")].filter(Boolean).join(\" · \");\n  $(\"c-sign\").textContent = \"✍️ \" + (PATIENT.first || \"Patient\") + \" signs on tablet\";\n  ptReady = !!(name && val(\"plan\"));\n  refreshCheck();\n}\n\n$(\"face-input\").addEventListener(\"change\", function (e) {\n  if (e.target.files[0]) scan(URL.createObjectURL(e.target.files[0]));\n});\n$(\"face-sample\").addEventListener(\"click\", function () { scan(null); });\n$(\"face-type\").addEventListener(\"click\", function () {\n  showForm();\n  syncPatient();\n  document.querySelector(\"#pt-fields input\").focus();\n});\n\n// Consent: text updates need opt-in (TCPA). Sharing for treatment/payment doesn't (HIPAA).\n$(\"c-sign\").addEventListener(\"click\", function () {\n  consentSigned = true;\n  $(\"c-sign\").classList.add(\"hidden\");\n  $(\"c-done\").classList.remove(\"hidden\");\n  $(\"c-done\").innerHTML = '<span class=\"sig small draw\">' + PATIENT.name + '<\/span><div class=\"muted\">✓ Signed on tablet · ' + clock() + ' · saved to chart<\/div>';\n  logAccess(\"doctor\", \"Recorded consent · texts \" + ($(\"c-text\").checked ? \"ON\" : \"OFF\") + \" · privacy notice given\");\n});\n$(\"c-text\").addEventListener(\"change\", function () {\n  $(\"rx-text\").textContent = $(\"c-text\").checked ? \"📱 Text · consented\" : \"🚫 No texts · patient declined\";\n});\n\n// ---------- 2. Prescription ----------\nfunction setDrug(text) {\n  if (!text.trim() || checked) return;\n  if (!ptReady) { toast(\"📷 Add the patient first: snap the facesheet\"); return; }\n  drug = findDrug(text);\n  $(\"drug-input\").value = drug.brand;\n  $(\"rx-line\").classList.remove(\"hidden\");\n  $(\"rx-dose\").textContent = drug.generic;\n  $(\"rx-pharm\").textContent = PHARMACY.name;\n\n  $(\"req-empty\").classList.add(\"hidden\");\n  $(\"req-body\").classList.remove(\"hidden\");\n  $(\"req-title\").textContent = PATIENT.plan + \" requires\";\n  $(\"req-head\").innerHTML = \"Prior auth for <b>\" + drug.brand + \"<\/b> · \" + drug.criteria.length + \" rules\";\n  $(\"rules\").innerHTML = drug.criteria.map(function (c) {\n    return '<li><span class=\"rule-ic\">?<\/span><span class=\"rule-txt\">' + c[0] + '<\/span><span class=\"rule-ev\"><\/span><\/li>';\n  }).join(\"\");\n  $(\"ai-log\").textContent = \"\";\n  refreshCheck();\n}\n\n$(\"drug-form\").addEventListener(\"submit\", function (e) { e.preventDefault(); setDrug($(\"drug-input\").value); });\n$(\"chips\").innerHTML = SUGGESTIONS.map(function (s) { return '<button class=\"chip\" type=\"button\">' + s + '<\/button>'; }).join(\"\");\n$(\"chips\").addEventListener(\"click\", function (e) {\n  if (e.target.classList.contains(\"chip\")) setDrug(e.target.textContent);\n});\n\n// ---------- 3. Records: photos or files; AI pulls out the values ----------\nasync function addFiles(names) {\n  for (var i = 0; i < names.length; i++) {\n    if (files.indexOf(names[i]) !== -1) continue;\n    files.push(names[i]);\n    var li = document.createElement(\"li\");\n    var ic = /\\.(jpe?g|png|heic|webp)$/i.test(names[i]) ? \"📷\" : \"📄\";\n    li.innerHTML = '<span class=\"file-ic\">' + ic + '<\/span><span class=\"file-name\">' + names[i] + '<\/span><span class=\"file-st\"><span class=\"spin\"><\/span>Reading…<\/span>';\n    $(\"files\").appendChild(li);\n    await wait(600);\n    var vals = EXTRACT[names[i]] || EXTRACT_POOL[(files.length - 1) % EXTRACT_POOL.length];\n    li.querySelector(\".file-st\").innerHTML = \"✓ \" + vals.length + \" values found\";\n    li.classList.add(\"read\");\n    li.insertAdjacentHTML(\"beforeend\", '<div class=\"vals\">' + vals.map(function (v) { return \"<span>\" + v + \"<\/span>\"; }).join(\"\") + '<\/div>');\n  }\n  if (names.length) logAccess(\"doctor\", \"📸 Stored \" + names.length + \" record image\" + (names.length > 1 ? \"s\" : \"\") + \" encrypted in the chart\");\n  if (names.length) logAccess(\"doctor\", \"Uploaded \" + names.length + \" record\" + (names.length > 1 ? \"s\" : \"\") + \" to \" + PATIENT.name + \"'s chart\");\n  refreshCheck();\n}\n\n$(\"file-input\").addEventListener(\"change\", function (e) {\n  addFiles(Array.prototype.map.call(e.target.files, function (f) { return f.name; }));\n});\n[\"dragenter\", \"dragover\"].forEach(function (ev) {\n  $(\"drop\").addEventListener(ev, function (e) { e.preventDefault(); $(\"drop\").classList.add(\"over\"); });\n});\n[\"dragleave\", \"drop\"].forEach(function (ev) {\n  $(\"drop\").addEventListener(ev, function (e) { e.preventDefault(); $(\"drop\").classList.remove(\"over\"); });\n});\n$(\"drop\").addEventListener(\"drop\", function (e) {\n  addFiles(Array.prototype.map.call(e.dataTransfer.files, function (f) { return f.name; }));\n});\n$(\"sample-btn\").addEventListener(\"click\", function () { addFiles(SAMPLE_FILES); });\n\n// Or type a value by hand (e.g. A1c 8.1%)\n$(\"type-btn\").addEventListener(\"click\", function () { $(\"type-form\").classList.toggle(\"hidden\"); $(\"tv-name\").focus(); });\n$(\"type-form\").addEventListener(\"submit\", function (e) {\n  e.preventDefault();\n  var n = $(\"tv-name\").value.trim(), v = $(\"tv-val\").value.trim();\n  if (!n || !v) return;\n  files.push(\"Typed: \" + n);\n  $(\"files\").insertAdjacentHTML(\"beforeend\", '<li class=\"read\"><span class=\"file-ic\">⌨️<\/span><span class=\"file-name\">Typed by staff<\/span><span class=\"file-st\">✓ added<\/span><div class=\"vals\"><span>' + n + \" \" + v + '<\/span><\/div><\/li>');\n  $(\"tv-name\").value = \"\"; $(\"tv-val\").value = \"\";\n  refreshCheck();\n});\n\nfunction refreshCheck() {\n  var ready = ptReady && drug && files.length && !checked;\n  $(\"check-btn\").disabled = !ready;\n  $(\"check-btn\").textContent = !files.length ? \"Add records to check\" : \"✨ Check records with AI\";\n}\n\n// ---------- AI check ----------\n$(\"check-btn\").addEventListener(\"click\", async function () {\n  checked = true;\n  $(\"check-btn\").classList.add(\"hidden\");\n  $(\"drug-input\").disabled = true;\n  var log = $(\"ai-log\"), items = $(\"rules\").children;\n\n  log.textContent = \"Reading \" + files.length + \" record\" + (files.length > 1 ? \"s\" : \"\") + \" + \" + PATIENT.first + \"'s chart…\";\n  await wait(1000);\n  for (var i = 0; i < items.length; i++) {\n    items[i].classList.add(\"checking\");\n    log.textContent = \"Looking for: \" + drug.criteria[i][0] + \"…\";\n    await wait(900);\n    items[i].classList.remove(\"checking\");\n    items[i].classList.add(\"met\");\n    items[i].querySelector(\".rule-ic\").textContent = \"✓\";\n    items[i].querySelector(\".rule-ev\").innerHTML = drug.criteria[i][1] + ' <span class=\"src\">· ' + files[i % files.length] + '<\/span>';\n  }\n  log.textContent = \"Pre-filled \" + PAYER.name + \"'s prior auth form · 24 of 24 fields · proof pages attached\";\n  await wait(600);\n  $(\"doc-verdict\").innerHTML = \"✓ Meets <b>\" + items.length + \" of \" + items.length + \"<\/b> of \" + PAYER.name + \"'s rules\";\n  renderMethods();\n  $(\"sign\").classList.remove(\"hidden\");\n});\n\n// ---------- How it goes to the plan ----------\nfunction renderMethods() {\n  $(\"methods\").innerHTML = Object.keys(METHODS).map(function (k) {\n    var m = METHODS[k];\n    return '<button type=\"button\" class=\"method' + (k === method ? \" on\" : \"\") + '\" data-m=\"' + k + '\"><b>' + m.ic + \" \" + m.name + '<\/b><span>' + m.sub + '<\/span><\/button>';\n  }).join(\"\");\n}\n$(\"methods\").addEventListener(\"click\", function (e) {\n  var b = e.target.closest(\"[data-m]\");\n  if (!b) return;\n  method = b.dataset.m;\n  renderMethods();\n});\n\n// Printable, already-filled PA form with a fax cover sheet\nfunction printForm() {\n  var w = window.open(\"\", \"_blank\");\n  if (!w) { toast(\"Allow pop-ups to print the form\"); return; }\n  var rows = drug.criteria.map(function (c, i) { return \"<tr><td>\" + c[0] + \"<\/td><td>\" + c[1] + \"<\/td><td>\" + files[i % files.length] + \"<\/td><\/tr>\"; }).join(\"\");\n  w.document.write('<html><head><title>PA form · ' + PATIENT.name + '<\/title><style>body{font:15px Arial;margin:40px;color:#111}h1{font-size:22px}h2{font-size:17px;margin-top:28px;border-bottom:2px solid #111}td,th{border:1px solid #999;padding:6px 8px;text-align:left}table{border-collapse:collapse;width:100%}.cover{border:3px solid #111;padding:18px;margin-bottom:30px}<\/style><\/head><body>' +\n    '<div class=\"cover\"><h1>FAX COVER · CONFIDENTIAL<\/h1>To: ' + PAYER.name + ' Pharmacy Prior Authorization · Fax ' + PAYER.paFax + '<br>From: ' + DOCTOR.name + ', ' + DOCTOR.clinic + ' · NPI ' + DOCTOR.npi + '<br>Pages: 1 + ' + files.length + ' attachments<br><small>Contains protected health information. If received in error, notify sender and destroy.<\/small><\/div>' +\n    '<h1>Prior Authorization Request · ' + PAYER.plan + '<\/h1>' +\n    '<h2>Patient<\/h2>' + PATIENT.name + ' · DOB ' + PATIENT.dob + ' · Member ' + PATIENT.memberId + ' · Phone ' + PATIENT.phone +\n    '<h2>Medication<\/h2>' + drug.brand + ' (' + drug.generic + ') · 30-day supply · Pharmacy: ' + PHARMACY.name +\n    '<h2>Criteria and evidence<\/h2><table><tr><th>Plan requires<\/th><th>Evidence<\/th><th>Source<\/th><\/tr>' + rows + '<\/table>' +\n    '<h2>Prescriber attestation<\/h2>I confirm this medication is medically necessary.<br><br>Signed electronically: ' + DOCTOR.name + ' · ' + new Date().toLocaleString() +\n    '<\/body><\/html>');\n  w.document.close();\n  w.focus();\n  setTimeout(function () { w.print(); }, 300);\n}\n\n// AI calls the plan's PA line on the clinic's behalf (says it's automated)\nasync function aiCall() {\n  $(\"call\").classList.remove(\"hidden\");\n  $(\"call-done\").classList.add(\"hidden\");\n  $(\"call-log\").innerHTML = \"\";\n  var start = Date.now(), timer = setInterval(function () {\n    var s = Math.floor((Date.now() - start) / 1000) * 6;\n    $(\"call-time\").textContent = Math.floor(s / 60) + \":\" + (\"0\" + s % 60).slice(-2);\n  }, 1000);\n  var lines = [\n    [\"sys\", \"📞 Dialing \" + PAYER.name + \" provider PA line \" + PAYER.paPhone + \"…\"],\n    [\"them\", \"<b>Phone menu:<\/b> For pharmacy prior authorization, press 2.\"],\n    [\"sys\", \"🤖 Pressed 2 · entered NPI \" + DOCTOR.npi],\n    [\"them\", \"<b>Aetna (Dana):<\/b> Pharmacy PA, this is Dana. How can I help?\"],\n    [\"ai\", \"<b>Linkt AI:<\/b> Hi Dana, I'm Linkt, an automated assistant calling for \" + DOCTOR.name + \"'s office. This call is recorded. I'm requesting prior auth for \" + drug.brand + \" \" + strength(drug) + \" for member \" + PATIENT.memberId + \".\"],\n    [\"them\", \"<b>Dana:<\/b> Sure. Can you confirm the date of birth?\"],\n    [\"ai\", \"<b>Linkt AI:<\/b> \" + PATIENT.dob + \".\"],\n    [\"them\", \"<b>Dana:<\/b> Got it. I'll need the clinicals.\"],\n    [\"ai\", \"<b>Linkt AI:<\/b> Sending \" + files.length + \" documents to your PA fax now. All \" + drug.criteria.length + \" criteria are met. May I have a reference number?\"],\n    [\"them\", \"<b>Dana:<\/b> Reference PA-REF-55812. You'll have a decision within 72 hours, usually today.\"],\n    [\"sys\", \"✓ Call ended · reference saved to the chart · transcript attached\"]\n  ];\n  for (var i = 0; i < lines.length; i++) {\n    await wait(i ? 900 : 400);\n    $(\"call-log\").insertAdjacentHTML(\"beforeend\", '<div class=\"cl ' + lines[i][0] + '\">' + lines[i][1] + '<\/div>');\n    $(\"call-log\").scrollTop = 99999;\n  }\n  clearInterval(timer);\n  $(\"call-title\").textContent = \"Call complete\";\n  $(\"call-done\").classList.remove(\"hidden\");\n  return new Promise(function (r) { $(\"call-done\").onclick = function () { $(\"call\").classList.add(\"hidden\"); r(); }; });\n}\n\n// ---------- E-sign & send ----------\n$(\"sign-btn\").addEventListener(\"click\", async function () {\n  if (method === \"print\") printForm();   // must open in the click, before any waiting\n  $(\"sign-btn\").classList.add(\"hidden\");\n  $(\"methods\").classList.add(\"locked\");\n  $(\"sig\").textContent = DOCTOR.name.replace(\"Dr. \", \"\");\n  $(\"sig\").classList.add(\"draw\");\n  await wait(1100);\n\n  var log = $(\"ai-log\");\n  if (method === \"fax\") {\n    log.textContent = \"📠 Faxing cover + form + \" + files.length + \" records to \" + PAYER.name + \" \" + PAYER.paFax + \"…\";\n    await wait(1600);\n    log.textContent = \"✓ Fax delivered · \" + (files.length + 2) + \" pages · confirmation saved\";\n  } else if (method === \"print\") {\n    log.textContent = \"🖨️ Printed. Fax it to \" + PAYER.name + \" at \" + PAYER.paFax + \". We'll track the answer here.\";\n  } else if (method === \"call\") {\n    await aiCall();\n    log.textContent = \"📞 Requested by phone · ref PA-REF-55812\";\n  } else {\n    log.textContent = \"⚡ Sent electronically to \" + PAYER.name;\n  }\n\n  var textOK = $(\"c-text\").checked;\n  var state = {\n    drugText: drug.brand, files: files, status: \"sent\", thread: [], texts: [], method: method, textConsent: textOK,\n    patient: { name: PATIENT.name, first: PATIENT.first, dob: PATIENT.dob, phone: PATIENT.phone, plan: PATIENT.plan, memberId: PATIENT.memberId }\n  };\n  post(state, \"system\", DOCTOR.name + \" sent the \" + drug.brand + \" prior auth to \" + PAYER.name + \" by \" + METHODS[method].name + \" · \" + files.length + \" records attached\");\n  textPatient(state, \"Linkt: \" + DOCTOR.name + \" sent a new prescription to your insurance for approval. We'll text you each step. Reply STOP to opt out.\");\n  saveState(state);\n  logAccess(\"doctor\", \"E-signed and sent PA by \" + METHODS[method].name + \" (\" + DOCTOR.name + \")\");\n  refreshThread(state);\n  $(\"to-payer\").href = stateLink(\"insurer.html\", state);\n  $(\"sent\").classList.remove(\"hidden\");\n  renderTrack($(\"track\"), state);\n  sentStatus = state.status;\n  toast(\"📨 Sent to <b>\" + PAYER.name + \"<\/b>\" + (textOK ? \" · \" + PATIENT.first + \" gets text updates\" : \"\"));\n});\n\n// ---------- Live updates: the clinic sees every step without calling anyone ----------\nvar sentStatus = null;\nonStateChange(function (s) {\n  if (!sentStatus) return;\n  renderTrack($(\"track\"), s);\n  if (s.expires) $(\"to-payer\").textContent = \"✓ PA valid until \" + s.expires;\n  if (s.status !== sentStatus) {\n    var by = s.status === \"approved\" ? PAYER.name : PHARMACY.name;\n    toast(\"🔔 <b>\" + by + \"<\/b>: \" + stageName(s, s.status));\n    sentStatus = s.status;\n  }\n});\n\n// ---------- Expiring prior auths: renew with one new upload ----------\nvar renewing = null;\nfunction renderRenewals() {\n  $(\"renew-rows\").innerHTML = RENEWALS.map(function (r, i) {\n    var st = r.done ? '<span class=\"pill approved\">✓ Renewal sent · AI matched all rules<\/span>'\n      : r.busy ? '<span class=\"pill working\"><span class=\"spin\"><\/span>' + r.busy + '<\/span>'\n      : '<button class=\"btn small-btn\" data-renew=\"' + i + '\">Renew · upload ' + r.need + '<\/button>';\n    return '<div class=\"renew-row\"><span><b>' + r.patient + '<\/b> · ' + r.drug + ' <span class=\"muted\">· ' + r.plan + '<\/span><\/span>' +\n      '<span class=\"exp' + (r.days < 14 ? \" soon\" : \"\") + '\">Expires ' + addDays(r.days) + ' · ' + r.days + ' days<\/span><span>' + st + '<\/span><\/div>';\n  }).join(\"\");\n}\n$(\"renew-rows\").addEventListener(\"click\", function (e) {\n  var b = e.target.closest(\"[data-renew]\");\n  if (!b) return;\n  renewing = +b.dataset.renew;\n  $(\"renew-input\").click();\n});\n$(\"renew-input\").addEventListener(\"change\", async function (e) {\n  var r = RENEWALS[renewing];\n  if (!r || !e.target.files.length) return;\n  r.busy = \"Reading \" + e.target.files[0].name + \"…\"; renderRenewals();\n  await wait(1200);\n  r.busy = \"Checking \" + r.plan + \"'s renewal rules…\"; renderRenewals();\n  await wait(1200);\n  r.busy = null; r.done = true; renderRenewals();\n  logAccess(\"doctor\", \"Renewed PA for \" + r.patient + \" (\" + r.drug + \")\");\n  toast(\"✓ Renewal for <b>\" + r.patient + \"<\/b> sent to \" + r.plan);\n  e.target.value = \"\";\n});\n\n// ---------- Ask Linkt AI (pre-written answers) ----------\nfunction answer(q) {\n  var t = q.toLowerCase();\n  if (!drug) return \"Add a patient and a medication first and I'll pull their plan's rules.\";\n  var d = drug, p = PATIENT.plan;\n  if (/why|need|require|prior/.test(t))\n    return p + \" requires prior auth for \" + d.brand + \" because it's a high-cost drug. They only need proof of the \" + d.criteria.length + \" rules on the right, and I can match each one to \" + PATIENT.first + \"'s records.\";\n  if (/not met|isn.t|fail|missing|deny|denied|below|under/.test(t))\n    return \"I'd flag that rule in grey <b>before<\/b> you sign and tell you exactly what's missing, like a recent lab. You never send a request that gets denied.\";\n  if (/alternative|cheaper|covered|instead|formulary|generic/.test(t))\n    return p + \" covers <b>\" + d.alt + \"<\/b> with no prior auth. But \" + d.brand + \" meets every rule, so approval is expected. No need to switch.\";\n  if (/expire|renew/.test(t))\n    return \"Approvals usually last 6 to 12 months. I remind you 30 days before, and renewing takes one new upload, like a recent lab.\";\n  if (/fast|long|time|when|quick|soon/.test(t))\n    return \"By ePA, \" + p + \" can approve in <b>minutes<\/b>. By fax or phone it's up to 72 hours. \" + PHARMACY.name + \" is notified the moment it's approved.\";\n  if (/copay|cost|price|pay/.test(t))\n    return \"Once approved, \" + PATIENT.first + \"'s copay is <b>$\" + PATIENT.copay + \"<\/b> for 30 days. Without approval the cash price is about \" + money(d.value) + \".\";\n  if (/upload|file|record|document|lab|photo/.test(t))\n    return \"Snap a photo or drop any lab report, visit note or med list. I read values like A1c and attach only the pages that prove each rule.\";\n  return \"I checked \" + p + \"'s policy for \" + d.brand + \": all you need are the \" + d.criteria.length + \" rules on the right. Upload any missing record and I'll match it automatically.\";\n}\n\nfunction addMsg(html, who) {\n  var m = document.createElement(\"div\");\n  m.className = \"msg \" + who;\n  m.innerHTML = html;\n  $(\"chat-msgs\").appendChild(m);\n  $(\"chat-msgs\").scrollTop = 99999;\n  return m;\n}\n\nasync function ask(q) {\n  if (!q.trim()) return;\n  addMsg(q, \"me\");\n  $(\"chat-input\").value = \"\";\n  var typing = addMsg('<span class=\"dots\"><i><\/i><i><\/i><i><\/i><\/span>', \"ai\");\n  await wait(900);\n  typing.innerHTML = answer(q);\n}\n\n$(\"chat-toggle\").addEventListener(\"click\", function () { $(\"chat\").classList.add(\"open\"); $(\"chat-input\").focus(); });\n$(\"chat-x\").addEventListener(\"click\", function () { $(\"chat\").classList.remove(\"open\"); });\n$(\"chat-form\").addEventListener(\"submit\", function (e) { e.preventDefault(); ask($(\"chat-input\").value); });\n$(\"q-chips\").innerHTML = QUESTIONS.map(function (q) { return '<button class=\"chip\" type=\"button\">' + q + '<\/button>'; }).join(\"\");\n$(\"q-chips\").addEventListener(\"click\", function (e) { if (e.target.classList.contains(\"chip\")) ask(e.target.textContent); });\n\n// ---------- Start ----------\n$(\"who\").textContent = LOGIN.doctor.name + \" · for \" + DOCTOR.name;\naddMsg(\"Hi Jasmine, I can explain the plan's rules, check what's missing, or find a covered alternative.\", \"ai\");\nrenderRenewals();\nrefreshCheck();\ninitThread(\"doctor\");\nportalLogin(\"doctor\");\n"}, "insurer": {"label": "Health plan", "ic": "🛡️", "phone": false, "cls": "", "title": "Linkt for Health Plans", "body": "\n\n  <header class=\"topbar dark\">\n    <div class=\"brand\"><span class=\"logo\"><\/span> Linkt <span class=\"role-tag\">for Health Plans<\/span><\/div>\n    <nav class=\"nav\"><a class=\"on\">PA inbox<\/a><a>Policies<\/a><a>Reports<\/a><\/nav>\n    <div class=\"who\" id=\"who\"><\/div>\n    <a class=\"restart\" href=\"#\" data-reset>↺ Reset<\/a>\n  <\/header>\n\n  <main class=\"page\">\n    <div class=\"inbox-grid\">\n      <div class=\"card inbox\">\n        <div class=\"card-title pad-x\">Prior auth inbox<\/div>\n        <div id=\"inbox\"><\/div>\n      <\/div>\n\n      <div class=\"card pad detail\">\n        <div class=\"empty\" id=\"waiting\">\n          <div class=\"empty-ic pulse\">📥<\/div>\n          <div>Waiting for new requests from clinics…<\/div>\n        <\/div>\n\n        <div class=\"hidden\" id=\"detail\">\n          <div class=\"payer-top\">\n            <div>\n              <div class=\"card-title\">Prior auth request · received just now · <span id=\"pay-via\"><\/span><\/div>\n              <div class=\"big-line\" id=\"pay-drug\"><\/div>\n              <div class=\"muted\" id=\"pay-meta\"><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"evidence-chips\" id=\"attach\"><\/div>\n\n          <table class=\"crit\">\n            <thead><tr><th>Aetna requires<\/th><th>Submitted evidence<\/th><th>Result<\/th><\/tr><\/thead>\n            <tbody id=\"crit-rows\"><\/tbody>\n          <\/table>\n\n          <div class=\"decide hidden\" id=\"decide\">\n            <div class=\"verdict big\" id=\"pay-verdict\"><\/div>\n            <div class=\"decide-btns\">\n              <button class=\"btn btn-ghost\" disabled title=\"Nothing failed. No reason to deny.\">Deny<\/button>\n              <button class=\"btn btn-big\" id=\"approve-btn\">✓ Approve<\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"approved hidden\" id=\"approved\">\n            <div class=\"stamp\">APPROVED<\/div>\n            <div>\n              <div class=\"big-line\" id=\"auth-line\"><\/div>\n              <div class=\"muted\"><span id=\"valid-line\"><\/span> · <b class=\"accent\">1m 48s<\/b> from script to approval<\/div>\n            <\/div>\n            <a class=\"btn\" id=\"to-pharm\" target=\"linkt_pharmacy\">Sent to pharmacy ↗<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "// Health plan site: a request arrives already proven, so the decision is a black-and-white yes / no\n\nvar state = null, shown = false;\n\nfunction renderInbox() {\n  var live = state ? '<div class=\"inbox-item on' + (state.status === \"sent\" ? \" new\" : \"\") + '\">' +\n    '<div><b>' + PATIENT.name + '<\/b> · ' + findDrug(state.drugText).brand + '<div class=\"muted\">from ' + DOCTOR.name + '<\/div><\/div>' +\n    '<span class=\"pill ' + (state.status === \"sent\" ? \"working\" : \"approved\") + '\">' + (state.status === \"sent\" ? \"✓ Auto-check passed\" : \"✓ Approved\") + '<\/span><\/div>' : \"\";\n  $(\"inbox\").innerHTML = live + INBOX.map(function (r) {\n    return '<div class=\"inbox-item old\"><div><b>' + r.patient + '<\/b> · ' + r.drug + '<div class=\"muted\">from ' + r.from + '<\/div><\/div>' +\n      '<span class=\"pill hold\">' + r.status + '<\/span><\/div>';\n  }).join(\"\");\n}\n\nasync function showRequest() {\n  if (shown) return;\n  shown = true;\n  var d = findDrug(state.drugText);\n  $(\"waiting\").classList.add(\"hidden\");\n  $(\"detail\").classList.remove(\"hidden\");\n  $(\"pay-drug\").textContent = d.brand + \" \" + strength(d) + \" for \" + PATIENT.name;\n  $(\"pay-meta\").textContent = \"Member \" + PATIENT.memberId + \" · \" + PATIENT.plan + \" · from \" + DOCTOR.name + \" · fill at \" + PHARMACY.name;\n  $(\"pay-via\").textContent = \"Received by \" + (METHODS[state.method] || METHODS.epa).via;\n  logAccess(\"insurer\", \"Opened PA request for \" + PATIENT.name + \" · viewed \" + state.files.length + \" records\");\n  $(\"attach\").innerHTML = state.files.map(function (f) { return \"<span>📎 \" + f + \"<\/span>\"; }).join(\"\") + \"<span>✍️ Signed attestation<\/span>\";\n  $(\"crit-rows\").innerHTML = d.criteria.map(function (c, i) {\n    return '<tr><td>' + c[0] + '<\/td><td>' + c[1] + '<div class=\"src\">' + state.files[i % state.files.length] + '<\/div><\/td><td><span class=\"met-tag pending\">checking<\/span><\/td><\/tr>';\n  }).join(\"\");\n\n  if (state.status !== \"sent\") return markApproved(true);\n\n  var tags = document.querySelectorAll(\"#crit-rows .met-tag\");\n  await wait(600);\n  for (var i = 0; i < tags.length; i++) {\n    await wait(500);\n    tags[i].className = \"met-tag\";\n    tags[i].textContent = \"✓ MET\";\n  }\n  await wait(300);\n  $(\"pay-verdict\").innerHTML = \"<b>\" + tags.length + \" of \" + tags.length + \" met<\/b> · matches Aetna policy exactly · no follow-up needed\";\n  $(\"decide\").classList.remove(\"hidden\");\n}\n\nfunction markApproved(already) {\n  document.querySelectorAll(\"#crit-rows .met-tag\").forEach(function (t) { t.className = \"met-tag\"; t.textContent = \"✓ MET\"; });\n  $(\"decide\").classList.add(\"hidden\");\n  $(\"approved\").classList.remove(\"hidden\");\n  $(\"auth-line\").textContent = \"Approved · \" + state.auth;\n  $(\"valid-line\").textContent = \"Valid until \" + state.expires;\n  $(\"to-pharm\").href = stateLink(\"pharmacy.html\", state);\n  renderInbox();\n  if (!already) toast(\"💊 Routed straight to <b>\" + PHARMACY.name + \"<\/b> · clinic & patient notified\");\n}\n\n$(\"approve-btn\").addEventListener(\"click\", function () {\n  var auth = \"PA-\" + Math.floor(40000 + Math.random() * 59999);\n  state = update(function (s) {\n    s.status = \"approved\";\n    s.auth = auth;\n    s.expires = addDays(365);\n    post(s, \"system\", PAYER.name + \" approved \" + auth + \" (valid until \" + s.expires + \") · routed straight to \" + PHARMACY.name);\n    if (!s.pharmacyJoined) post(s, \"system\", PHARMACY.name + \" isn't on Linkt yet · faxed the approval + a free sign-up link to \" + PHARMACY.fax);\n    if (s.fulfillment) textPatient(s, \"Linkt: Good news, your insurance approved your prescription. \" + PHARMACY.name + \" will deliver it to your home.\");\n    else textPatient(s, \"Linkt: Good news, your insurance approved your prescription. It's been sent to \" + PHARMACY.name + \". Pick it up, or get it delivered free?\", true);\n  }, state);\n  logAccess(\"insurer\", \"Approved \" + auth + \" for \" + PATIENT.name);\n  markApproved(false);\n});\n\nfunction receive(s) {\n  var isNew = !state;\n  state = s;\n  if (s.noPA) {\n    $(\"waiting\").innerHTML = '<div class=\"empty-ic\">🎉<\/div><div><b>' + findDrug(s.drugText).brand + '<\/b> for ' + PATIENT.name + ' is covered with no prior auth.<br>Nothing to review: the coverage check ran before the script was sent.<\/div>';\n    return;\n  }\n  renderInbox();\n  if (isNew && s.status === \"sent\") toast(\"📥 New request from <b>\" + DOCTOR.name + \"<\/b> · \" + findDrug(s.drugText).brand);\n  showRequest();\n}\n\n// ---------- Start ----------\n$(\"who\").textContent = PAYER.name + \" · \" + PAYER.reviewer;\nvar s0 = loadState();\nrenderInbox();\nif (s0) receive(s0);\nonStateChange(function (s) { if (!state) receive(s); else state = s; });\ninitThread(\"insurer\");\n , no per-script fees.<\/span><\/div><\/li>\n        <\/ul>\n        <button class=\"btn btn-big full\" id=\"join-btn\">Join free &amp; claim this script<\/button>\n        <div class=\"fine\">Not claimed by 6 PM? The patient is texted a choice of other in-network pharmacies. The patient always picks.<\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <!-- ORDERS -->\n  <main class=\"page tab hidden\" id=\"tab-orders\">\n    <div class=\"ord-head\">\n      <div class=\"hero\"><div class=\"hero-num\" id=\"q-hero\">0<\/div><div class=\"hero-sub\" id=\"ord-sub\"><\/div><\/div>\n    <\/div>\n    <div class=\"kpis adm-kpis\" id=\"q-kpis\"><\/div>\n    <div class=\"seg q-filter\" id=\"q-filter\"><\/div>\n\n    <div class=\"card pad dispense hidden\" id=\"dispense\">\n      <div class=\"dispense-badge\" id=\"disp-badge\">✓<\/div>\n      <div class=\"dispense-info\">\n        <div class=\"card-title accent\" id=\"disp-title\"><\/div>\n        <div class=\"big-line\" id=\"disp-drug\"><\/div>\n        <div class=\"muted\" id=\"disp-meta\"><\/div>\n        <div class=\"fulfil\" id=\"disp-fulfil\"><\/div>\n        <ol class=\"track mini\" id=\"pharm-track\"><\/ol>\n      <\/div>\n      <div class=\"dispense-act\">\n        <button class=\"btn btn-big\" id=\"dispense-btn\"><\/button>\n        <div class=\"notify-line\" id=\"notify-line\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"q-wrap\">\n      <div class=\"q-list\" id=\"ord-list\"><\/div>\n      <div class=\"q-detail card pad\" id=\"q-detail\"><div class=\"muted\">Tap an order to see what was prescribed, its updates and what to do next.<\/div><\/div>\n    <\/div>\n  <\/main>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "// Pharmacy site: a pharmacy not on Linkt gets the approval by fax, joins free to claim it,\n// then each one-tap status update notifies the doctor and texts the patient.\n\nvar orders = ORDERS.map(function (o) { return Object.assign({}, o); });\nvar state = null, live = nu n  .modal { align-items: flex-end !important; padding: 0 !important; }\n  .modal-card { width: 100% !important; border-radius: 28px 28px 0 0; animation: sheet .28s cubic-bezier(.2,.9,.3,1); max-height: 92vh; }\n  .topbar { padding: 10px 16px; }\n  .page { padding: 18px 16px 120px; }\n  .hero-num { font-size: 52px; }\n  .big-line { font-size: 30px; }\n}\n@keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }\n\n/* Toast: black pill at the top */\n.toast { background: var(--ink); color: #fff; border-radius: 999px; font-weight: 600; font-size: 15px; }\n\n/* Swipe to confirm (Robinhood \"swipe up to submit\", sideways here) */\n.swipe { position: relative; height: 64px; border-radius: 999px; background: var(--accent); overflow: hidden; user-select: none; touch-action: none; margin-top: 18px; }\n.swipe-label { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff; letter-spacing: -.01em; pointer-events: none; transition: opacity .2s; }\n.swipe-knob { position: absolute; top: 6px; left: 6px; width: 52px; height: 52px; border-radius: 50%; background: #fff; color: var(--accent); display: grid; place-items: center; font-size: 24px; font-weight: 800; cursor: grab; border: none; transition: left .25s cubic-bezier(.2,.9,.3,1); }\n.swipe-knob:focus-visible { outline: 3px solid #000; outline-offset: 3px; }\n.swipe.drag .swipe-knob { transition: none; cursor: grabbing; }\n.swipe.done { background: var(--teal); }\n.swipe.done .swipe-label { color: #fff; }\n.swipe.off { background: var(--soft); pointer-events: none; }\n.swipe.off .swipe-label { color: #AEB4BA; }\n.swipe.off .swipe-knob { background: #C9CED3; color: #fff; }\n\n/* Success screen */\n.success { text-align: center; padding: 48px 20px; animation: fade .3s ease; }\n.success-ring { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 48px; font-weight: 900; display: grid; place-items: center; 't write or post a review for them, can't offer rewards for reviews, and can't ask only happy users.\nvar REVIEW_KEY = \"linkt-review-asked\";\nfunction askForRating(appName, moment) {\n  if (localStorage.getItem(REVIEW_KEY)) return;\n  localStorage.setItem(REVIEW_KEY, \"1\");\n  var ios = /iPhone|iPad|Mac/.test(navigator.userAgent), store = ios ? \"the App Store\" : \"Google Play\";\n  var m = document.createElement(\"div\");\n  m.className = \"modal\";\n  m.innerHTML = '<div class=\"modal-card os-sheet\"><div class=\"os-tag\">System sheet · shown by ' + (ios ? \"Apple\" : \"Google\") + ', not by us<\/div>' +\n    '<div class=\"os-ic\"><span class=\"logo\"><\/span><\/div><b>Enjoying ' + appName + '?<\/b><div class=\"muted\">Tap a star to rate it on ' + store + '.<\/div>' +\n    '<div class=\"os-stars\">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type=\"button\" data-star=\"' + n + '\">☆<\/button>'; }).join(\"\") + '<\/div>' +\n    '<div class=\"os-btns\"><button type=\"button\" data-later>Not now<\/button><button type=\"button\" data-submit disabled>Submit<\/button><\/div>' +\n    '<div class=\"os-after hidden\"><div class=\"muted\">Thanks! Want to tell the Linkt team what helped most? (private, not posted)<\/div><div class=\"chips\">' +\n      [\"Saves me time\", \"Easy to use\", \"Family loves the updates\", \"Works offline\", \"Translation\"].map(function (c) { return '<button type=\"button\" class=\"chip\" data-fb>' + c + '<\/button>'; }).join(\"\") + '<\/div><button type=\"button\" class=\"btn small-btn\" data-close>Done<\/button><\/div><\/div>';\n  var stars = 0;\n  m.addEventListener(\"click\", function (e) {\n    var st = e.target.closest(\"[data-star]\");\n    if (st) { stars = +st.dataset.star; m.querySelectorAll(\"[data-star]\").forEach(function (b) { b.textContent = +b.dataset.star <= stars ? \"★\" : \"☆\"; }); m.querySelector(\"[data-submit]\").disabled = false; }\n    if (e.target.closest(\"[data-later]\") || e.target.closest(\"[data-close] value; draw(); } });\n  document.body.appendChild(m);\n}\ndocument.addEventListener(\"keydown\", function (e) { if ((e.key === \"Enter\" || e.key === \" \") && e.target.matches && e.target.matches(\"[role=button]\")) { e.preventDefault(); e.target.click(); } });\n\n// Pharmacies that have this drug on hand right now (no patient info shared), closest first, in-network first\nfunction stockFor(key) {\n  return FILL_NETWORK.map(function (p) { return Object.assign({ have: (STOCK[p.name] || {})[key] || 0 }, p); })\n    .filter(function (p) { return p.have > 0; })\n    .sort(function (a, b) { return (b.net - a.net) || (a.mi - b.mi); });\n}\n\n// ---------- Clarification fax: one question, tick a box, sign, fax back (or answer in Linkt) ----------\nfunction clarifyFax(o) {\n  var D = PRESCRIBER_DIR[o.prescriber] || { practice: \"Prescriber's office\", fax: \"—\", linkt: false, src: \"NPI registry\" }, via = D.linkt ? \"linkt\" : \"fax\";\n  var m = document.createElement(\"div\");\n  m.className = \"modal\";\n  function draw() {\n    m.innerHTML = '<div class=\"modal-card wide cf-card\"><button class=\"chat-x\" data-x>×<\/button><div class=\"flow-kicker\">Ask the doctor to clarify<\/div><h2 class=\"ms-h\">' + o.field + ' needed<\/h2><div class=\"muted\">' + o.problem + '<\/div>' +\n      '<div class=\"fax-paper pa-form cf-fax\"><div class=\"fax-hd\"><b>CLARIFICATION REQUEST · 1 page<\/b><span>To ' + o.prescriber + ' · ' + D.practice + ' · fax ' + D.fax + '<\/span><\/div>' +\n        '<table class=\"fax-t\"><tr><td>Patient<\/td><td>' + o.patient + ' · DOB ' + o.dob + '<\/td><\/tr><tr><td>Prescription<\/td><td>' + o.item + '<\/td><\/tr><tr><td>From<\/td><td>' + o.from + '<\/td><\/tr><\/table>' +\n        '<div class=\"cf-q\"><b>' + o.q + '<\/b> (tick one)<\/div>' + o.options.map(function (op) {\n          return '<div class=\"cf-opt\"><span class=\"cf-box\"><\/span><b>' + op[0] + '<\/b> ' + op[1] + (op[2] ? ' <i>· ' + op[2] + '<\/i>' : \"\") + '<\/div>';\n        }).join(\"\ eturn x[0] === o.pick; })[0];\n    m.querySelectorAll(\".cf-opt\").forEach(function (el) { if (el.textContent.indexOf(o.pick) > -1) { el.classList.add(\"on\"); el.querySelector(\".cf-box\").textContent = \"✓\"; } });\n    m.querySelector(\".cf-sign\").innerHTML = 'Prescriber signature <span class=\"sig small draw\">' + o.prescriber.split(\" \").pop() + '<\/span> Date ' + new Date().toLocaleDateString();\n    $(\"cf-out\").innerHTML = '<div class=\"verdict\">✓ ' + o.prescriber + ' ticked <b>' + op[0] + '<\/b> ' + op[1] + ' and signed' + (via === \"fax\" ? \" · fax received, AI read the tick\" : \"\") + '<\/div><button type=\"button\" class=\"btn\" data-x>Use this<\/button>';\n    o.onDone(op, via === \"fax\" ? \"fax \" + D.fax : \"Linkt\");\n  });\n}\n"};
var FONTS = "<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Homemade+Apple&display=swap\" rel=\"stylesheet\">";
var PATCH = "\ndocument.addEventListener(\"click\", function (e) {\n  var a = e.target.closest && e.target.closest(\"a[href]\");\n  if (!a) return;\n  var m = (a.getAttribute(\"href\") || \"\").match(/^([a-z]+)\\.html/);\n  if (!m) return;\n  e.preventDefault(); e.stopPropagation();\n  parent.postMessage({ linktOpen: m[1] }, \"*\");\n}, true);\n";
var SHIM = "\n(function () {\n  // Each screen keeps its own copy of the shared data and stays in sync with the others\n  // by messages through the page. Works even where browser storage or frame access is blocked.\n  var SNAP = window.__LINKT_SNAP || { local: {}, session: {} };\n  function mk(area) {\n    var map = SNAP[area] || {};\n    function send(k, v) { try { window.parent.postMessage({ linktSet: 1, area: area, k: k, v: v }, \"*\"); } catch (e) {} }\n    return {\n      getItem: function (k) { return Object.prototype.hasOwnProperty.call(map, k) ? map[k] : null; },\n      setItem: function (k, v) { v = String(v); map[k] = v; send(k, v); },\n      removeItem: function (k) { delete map[k]; send(k, null); },\n      clear: function () { Object.keys(map).forEach(function (k) { delete map[k]; send(k, null); }); },\n      key: function (i) { return Object.keys(map)[i] || null; },\n      get length() { return Object.keys(map).length; },\n      _apply: function (k, v) { if (v === null) delete map[k]; else map[k] = v; }\n    };\n  }\n  var L = mk(\"local\"), S = mk(\"session\");\n  try {\n    Object.defineProperty(window, \"localStorage\", { value: L, configurable: true });\n    Object.defineProperty(window, \"sessionStorage\", { value: S, configurable: true });\n  } catch (e) {}\n  window.addEventListener(\"message\", function (e) {\n    var d = e.data;\n    if (!d || !d.linktSync) return;\n    var st = d.area === \"local\" ? L : S, old = st.getItem(d.k);\n    st._apply(d.k, d.v);\n    if (d.area === \"local\") { try { window.dispatchEvent(new StorageEvent(\"storage\", { key: d.k, oldValue: old, newValue: d.v })); } catch (x) {} }\n  });\n})();\n";

// ---------- One shared store for every screen ----------
// Uses the browser's storage when allowed (so data survives a refresh); otherwise keeps it in memory,
// which is what makes the file work inside previews, email/file viewers and locked-down browsers.
var REAL = null;
try { REAL = window.localStorage; REAL.setItem("__linkt_t", "1"); REAL.removeItem("__linkt_t"); } catch (e) { REAL = null; }
var MAPS = { local: {}, session: {} };
if (REAL) { for (var i = 0; i < REAL.length; i++) { var k0 = REAL.key(i); if (k0 && k0.indexOf("linkt-") === 0) MAPS.local[k0] = REAL.getItem(k0); } }
// Hub: a screen changed something → save it here and tell every other screen
window.addEventListener("message", function (e) {
  var d = e.data;

var ORDER = Object.keys(PAGES);

function doc(name) {

    '<style>' + COMMON.css + '</style></head><body class="' + p.cls + '">' + p.body +

function pane(name) {

function render() {
  var st = document.getElementById("stage");

  Array.prototype.slice.call(st.children).forEach(function (c) { c.style.display = "none"; });
  visible.forEach(function (n) { var d = pane(n); if (d.parentNode !== st) st.appendChild(d); d.style.display = ""; st.appendChild(d); });
  document.getElementById("tabs").innerHTML = ORDER.map(function (n) {
    var on = visible.indexOf(n) !== -1;
    return '<button data-n="' + n + '" class="' + (on ? (split ? "on side" : "on") : "") + '">' + PAGES[n].ic + ' ' + PAGES[n].label + '</button>';
  }).join("");
  document.getElementById("split").classList.toggle("on", split);
  document.getElementById("hint").textContent = split ? "Tap tabs to add or remove (up to 3)" : "";
}
function open(n) {
  if (!PAGES[n]) return;
  if (!split) visible = [n];
  else if (visible.indexOf(n) === -1) { visible.push(n); if (visible.length > 3) visible.shift(); }
  render();
}
document.getElementById("tabs").addEventListener("click", function (e) {
  var b = e.target.closest("[data-n]");
  if (!b) return;

  open(n);
});
document.getElementById("split").addEventListener("click", function () {
  split = !split;
  if (split && visible.length === 1) visible = visible[0] === "index" ? ["visit", "agency", "family"] : [visible[0]];
  if (!split) visible = [visible[visible.length - 1]];

});
function reloadAll() { Object.keys(frames).forEach(function (n) { frames[n].querySelector("iframe").srcdoc = doc(n); }); }
document.getElementById("reset").addEventListener("click", function () {
  try {
    Object.keys(MAPS.local).filter(function (k) { return k !== "linkt-edition"; }).forEach(function (k) { delete MAPS.local[k]; if (REAL) try { REAL.removeItem(k); } catch (e) {} });
