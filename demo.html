<\/div><div class=\"ai-log muted\">Reading the ' + PA_DOCS[k].name.toLowerCase() + '…<\/div>';\n  area.scrollIntoView({ behavior: \"smooth\", block: \"center\" });\n  await wait(1200);\n  area.querySelector(\".scan-bar\").remove();\n  area.querySelectorAll(\".hl, .hl-tag\").forEach(function (el) { el.classList.add(\"on\"); });\n  var got = crit.filter(function (c) { return c.doc === k; });\n  area.querySelector(\".ai-log\").innerHTML = '<span class=\"accent\">✨ Highlighted what ' + pt.plan.split(\" \")[0] + ' needs: ' + got.map(function (c) { return c.val; }).join(\" · \") + ' · added to the form<\/span>';\n  got.forEach(function (c) { pk.found[c.id] = \"doc\"; });\n  pk.docs[k] = true; pk.last = k;\n  logAccess(\"prescriber\", \"Captured \" + PA_DOCS[k].name.toLowerCase() + \" for a PA packet (photo deleted after reading)\");\n  await wait(1400);\n  refresh();\n}\n\ndocument.addEventListener(\"click\", function (e) {\n  var sd = e.target.closest(\"[data-snapdoc]\"), v = e.target.closest(\"[data-via]\");\n  if (sd) return scanDoc(sd.dataset.snapdoc);\n  if (e.target.closest(\"[data-attest]\")) { pk.attest = true; refresh(); }\n  if (v) { pk.via = v.dataset.via; refresh(); }\n  if (e.target.closest(\"#pk-preview\")) { pk.preview = !pk.preview; refresh(); }\n  if (e.target.closest(\"#pull-chart\")) {\n    (PA_CRITERIA[MEDS[rx.key].cls] || []).forEach(function (c) { if (c.doc && !pk.found[c.id]) pk.found[c.id] = \"chart\"; });\n    pk.fromChart = true; toast(\"✨ Pulled the A1c, medication history and diagnosis from the chart\"); refresh();\n  }\n});\n\n// ---------- 4. Sign & send ----------\n$(\"send-btn\").addEventListener(\"click\", function () {\n  var m = MEDS[rx.key], plan = pt.plan, c = plan ? coverage(plan, rx.key) : null, fax = pharm !== RX_PHARMACIES[0];\n  if (c && c.st === \"pa\" && !pkDone(m)) { toast(\"📋 Finish the PA packet first: \" + pkMissing(m).length + \" item(s) left\"); step = steps().indexOf(\"s-pa\"); return flowUI(); }\n  var F = c && c.st === \"pa\" ? PA_FORMS[plan] : null, pages = F ? F.pages + Object.keys(pk.docs).length + 1 : 0;\n  var r = {\n    id: \"rx\" + Date.now().toString(36), med: rx.key, strength: rx.strength,\n    patient: { name: pt.name, dob: pt.dob, plan: plan, member: pt.member || null, mbi: pt.mbi || null, rx: pt.rx || null },\n    drug: m.name + \" \" + rx.strength + \" \" + m.form, sig: rx.sig, qty: $(\"qty-in\").value, refills: $(\"ref-in\").value,\n    prescriber: DR, pharmacy: pharm, fax: fax, how: how, when: \"today\",\n    pa: !plan ? \"noins\" : c.st === \"pa\" ? \"submitted\" : \"none\",\n    paNote: !plan ? \"No insurance sent · find it from the Medicare card\" : c.st === \"pa\" ? (pk.via === \"fax\" ? \"PA packet faxed to \" + plan + \" at \" + F.fax + \" · \" + pages + \" pages\" : \"PA sent by \" + F.epa) + \" · Linkt checks the status\" : c.st === \"not\" ? \"Not covered · cash price\" : \"Covered, no prior auth (checked before sending)\",\n    copay: c && c.copay != null ? c.copay : null, step: \"new\", msgs: [], history: [[clock(), \"e-Rx sent by \" + DR + (fax ? \" · faxed with a claim QR (pharmacy not on Linkt yet)\" : \"\")]]\n  };\n  if (r.pa === \"submitted\") r.history.push([clock(), \"PA packet sent to \" + plan + (pk.via === \"fax\" ? \" · fax \" + F.fax + \" · cover sheet + \" + F.form.split(\" · \")[1] + \" + \" + (Object.keys(pk.docs).length ? Object.keys(pk.docs).map(function (k) { return PA_DOCS[k].name.toLowerCase(); }).join(\", \") : \"chart records\") : \" · \" + F.epa)]);\n  rxSay(r, \"system\", \"Script sent to \" + pharm.split(\" · \")[0] + (r.pa === \"submitted\" ? \" · prior auth sent to \" + plan : \"\"));\n  saveRx(readRx().concat([r]));\n  logAccess(\"prescriber\", \"Sent \" + r.drug + \" for \" + pt.name);\n  toast(\"✍️ Signed &amp; sent to <b>\" + pharm.split(\" · \")[0] + \"<\/b>\" + (r.pa === \"submitted\" ? \" · prior auth sent to \" + plan : \"\"));\n  if (r.pa === \"submitted\") setTimeout(function () {\n    updateRx(r.id, function (x) { if (x.pa !== \"submitted\") return; x.pa = \"approved\"; x.paNote = \"Approved · valid until \" + addDays(365); x.history.push([clock(), plan + \" approved the prior auth\"]); rxSay(x, \"system\", plan + \" approved the prior auth ✓\"); });\n    toast(\"✅ <b>\" + plan + \"<\/b> approved \" + m.name + \" for \" + r.patient.name);\n    renderSent();\n  }, 3500);\n  showDone(r);\n  renderSent();\n});\n\nfunction showDone(r) {\n  [\"s-pt\", \"s-rx\", \"s-cov\", \"s-pa\", \"s-send\"].forEach(function (x) { $(x).classList.add(\"hidden\"); });\n  $(\"flow-cta\").classList.add(\"hidden\"); $(\"flow-bar\").innerHTML = \"\"; $(\"kicker\").textContent = \"\"; $(\"flow-title\").textContent = \"\"; $(\"back\").style.visibility = \"hidden\";\n  $(\"s-done\").classList.remove(\"hidden\");\n  $(\"s-done\").innerHTML = '<div class=\"success\"><div class=\"success-ring\">✓<\/div><h2>Sent<\/h2><p>' + r.drug + ' for ' + r.patient.name + ' is on its way to ' + r.pharmacy.split(\" · \")[0] + (r.pa === \"submitted\" ? \". Prior auth packet sent to \" + r.patient.plan + \". We'll tell you the moment it's approved.\" : \". You'll see every step live.\") + '<\/p>' +\n    '<button type=\"button\" class=\"btn\" id=\"done-track\">Track it<\/button><button type=\"button\" class=\"btn btn-soft\" id=\"done-new\">New prescription<\/button><\/div>';\n  $(\"done-track\").addEventListener(\"click\", function () { open = r.id; view(\"activity\"); });\n  $(\"done-new\").addEventListener(\"click\", function () { newScript(); });\n}\n\nfunction newScript() {\n  pt = null; rx = { key: null, strength: null, sig: null };\n  [\"ins-out\", \"med-sug\", \"card-scan\", \"pad-scan\"].forEach(function (id) { $(id).innerHTML = \"\"; });\n  $(\"card-scan\").classList.add(\"hidden\"); $(\"pad-scan\").classList.add(\"hidden\");\n  $(\"card-btn\").classList.remove(\"hidden\"); $(\"pad-btn\").classList.remove(\"hidden\"); $(\"skip-ins\").classList.remove(\"hidden\");\n  $(\"med-in\").value = \"\"; $(\"pt-name\").value = \"\"; $(\"pt-dob\").value = \"\";\n  $(\"med-pick\").classList.add(\"hidden\");\n  step = 0; $(\"flow-cta\").classList.remove(\"hidden\"); $(\"s-done\").classList.add(\"hidden\");\n  refresh();\n}\n\n// ---------- Sent scripts + conversation ----------\nfunction status(r) {\n  if (r.fax && r.step === \"new\") return [\"Faxed · waiting for pharmacy\", \"hold\"];\n  if (r.pa === \"noins\") return [\"Pharmacy finding insurance\", \"working\"];\n  if (r.pa === \"submitted\") return [\"Prior auth in review\", \"working\"];\n  if (r.pa === \"required\") return [\"Pharmacy starting PA\", \"working\"];\n  return { new: [r.seen ? \"Received by pharmacy\" : \"Sent\", r.seen ? \"ready\" : \"hold\"], filling: [\"Filling\", \"working\"], ready: [\"Ready for pickup\", \"approved\"], out: [\"Out for delivery\", \"approved\"], done: [r.how === \"delivery\" ? \"Delivered ✓\" : \"Picked up ✓\", \"approved\"] }[r.step];\n}\n\nvar ST_IC = { hold: \"📨\", ready: \"📥\", working: \"⏳\", approved: \"✓\" };\nfunction mine() { return readRx().filter(function (r) { return /Shah/.test(r.prescriber); }); }\nfunction thr(r) { return r.daycare ? (r.mdMsgs || []) : r.msgs; }\nfunction renderSent() {\n  var list = mine().slice().reverse();\n  var asks = list.filter(function (r) { return r.msgs.some(function (x) { return x.ask && !x.ask.done; }); }).length;\n  var moving = list.filter(function (r) { return r.step !== \"done\"; }).length;\n  $(\"act-num\").textContent = moving;\n  $(\"act-sub\").innerHTML = (moving === 1 ? \"script\" : \"scripts\") + \" in motion\" + (asks ? ' · <span class=\"neg\">' + asks + ' need' + (asks === 1 ? \"s\" : \"\") + ' you<\/span>' : list.length ? ' · <b>' + list.filter(function (r) { return r.step === \"done\"; }).length + ' done<\/b>' : \"\");\n  $(\"act-dot\").classList.toggle(\"hidden\", !asks);\n  $(\"sent-list\").innerHTML = list.map(function (r) {\n    var s = status(r), last = r.history[r.history.length - 1], ask = r.msgs.some(function (x) { return x.ask && !x.ask.done; });\n    return '<div class=\"act-row\" data-r=\"' + r.id + '\"><div class=\"act-ic\">' + (ask ? \"💬\" : ST_IC[s[1]] || \"•\") + '<\/div><div><b>' + r.patient.name + (ask ? '<span class=\"badge-dot\"><\/span>' : \"\") + '<\/b><span class=\"muted\">' + r.drug + ' · ' + r.pharmacy.split(\" · \")[0] + '<\/span><\/div>' +\n      '<div class=\"act-st\"><span class=\"' + (ask ? \"neg\" : s[1] === \"approved\" ? \"pos\" : \"\") + '\">' + (ask ? \"Pharmacy asks\" : s[0]) + '<\/span><small>' + last[0] + '<\/small><\/div><\/div>';\n  }).join(\"\") || '<div class=\"muted\">Nothing sent yet. Your scripts show up here with live status from the pharmacy.<\/div>';\n  renderConv();\n}\n\nfunction renderConv() {\n  var r = mine().filter(function (x) { return x.id === open; })[0];\n  $(\"conv\").classList.toggle(\"hidden\", !r);\n  $(\"sent-list\").classList.toggle(\"hidden\", !!r);\n  document.querySelector(\"#v-activity .hero\").classList.toggle(\"hidden\", !!r);\n  if (!r) return;\n  var s = status(r), last = r.history[r.history.length - 1];\n  $(\"conv-title\").textContent = r.pharmacy.split(\" · \")[0];\n  $(\"conv-head\").innerHTML = '<div class=\"review-hero left\"><div class=\"muted\">' + r.patient.name + ' · ' + r.drug + '<\/div><div class=\"hero-num sm\">' + s[0] + '<\/div><div class=\"hero-sub\">' + last[1] + ' · ' + last[0] + '<\/div><\/div>' +\n    '<ol class=\"qd-hist\">' + r.history.slice().reverse().map(function (h, i) { return '<li class=\"' + (i === 0 ? \"now\" : \"\") + '\"><span class=\"muted\">' + h[0] + '<\/span><span>' + h[1] + '<\/span><\/li>'; }).join(\"\") + '<\/ol>';\n  $(\"conv-msgs\").innerHTML = thr(r).map(function (m, i) {\n    if (m.from === \"system\") return '<div class=\"sys\">' + m.text + ' · ' + m.t + '<\/div>';\n    var mine = m.from === \"prescriber\";\n    return '<div class=\"msg ' + (mine ? \"me\" : \"ai\") + '\">' + (mine ? \"\" : '<div class=\"from\">💊 ' + r.pharmacy.split(\" · \")[0] + '<\/div>') + m.text +\n      (m.ask && !m.ask.done && !mine ? '<div class=\"ask-btns\"><button type=\"button\" class=\"btn small-btn\" data-yes=\"' + i + '\">✓ Approve switch<\/button><button type=\"button\" class=\"btn small-btn btn-soft\" data-no=\"' + i + '\">Keep original<\/button><\/div>' : \"\") +\n      (m.ask && m.ask.done ? '<div class=\"muted ask-done\">' + m.ask.done + '<\/div>' : \"\") + '<div class=\"t\">' + m.t + '<\/div><\/div>';\n  }).join(\"\") || '<div class=\"sys\">No messages yet.<\/div>';\n  $(\"conv-msgs\").scrollTop = 99999;\n  $(\"conv-chips\").innerHTML = [\"Any problem with the PA?\", \"Patient prefers delivery\", \"Please call me\", \"OK to give a generic\"].map(function (c) { return '<button type=\"button\" class=\"chip\">' + c + '<\/button>'; }).join(\"\");\n}\n\nfunction say(text) {\n  if (!text.trim() || !open) return;\n  updateRx(open, function (r) { if (r.daycare) { r.mdMsgs = r.mdMsgs || []; r.mdMsgs.push({ from: \"prescriber\", text: text.trim(), t: clock() }); } else rxSay(r, \"prescriber\", text.trim()); });\n  $(\"conv-in\").value = \"\";\n  renderSent();\n}\n$(\"conv-form\").addEventListener(\"submit\", function (e) { e.preventDefault(); say($(\"conv-in\").value); });\n$(\"conv-chips\").addEventListener(\"click\", function (e) { if (e.target.classList.contains(\"chip\")) say(e.target.textContent); });\n\n// Answer a pharmacy's switch request in one tap: a new script goes over, coverage rechecked\ndocument.addEventListener(\"click\", function (e) {\n  var it = e.target.closest(\"[data-r]\");\n  if (it) { open = it.dataset.r; renderSent(); return; }\n  var y = e.target.closest(\"[data-yes]\"), n = e.target.closest(\"[data-no]\");\n  if (!y && !n) return;\n  updateRx(open, function (r) {\n    var m = r.msgs[+(y || n).dataset[y ? \"yes\" : \"no\"]], a = m.ask;\n    if (y) {\n      var to = MEDS[a.key], c = coverage(r.patient.plan, a.key), was = r.drug;\n      r.med = a.key; r.strength = a.strength; r.drug = to.name + \" \" + a.strength + \" \" + to.form; r.sig = to.sigs[0]; r.qty = to.qty;\n      r.pa = c.st === \"pa\" ? \"required\" : \"none\"; r.paNote = c.st === \"pa\" ? \"Needs prior auth on \" + r.patient.plan : \"Covered, no prior auth\";\n      r.copay = c.copay != null ? c.copay : null;\n      a.done = \"✓ Approved by \" + DR;\n      rxSay(r, \"prescriber\", \"Approved. Switch to \" + r.drug + \", \" + r.sig.toLowerCase() + \". New script sent.\");\n      r.history.push([clock(), DR + \" approved switch: \" + was + \" → \" + r.drug + \" · new e-Rx signed\"]);\n    } else {\n      a.done = \"Kept original\";\n      rxSay(r, \"prescriber\", \"Please keep \" + r.drug + \". We'll wait for stock.\");\n    }\n  });\n  logAccess(\"prescriber\", (y ? \"Approved switch\" : \"Declined switch\") + \" on a pharmacy request\");\n  toast(y ? \"✍️ New script signed &amp; sent\" : \"💬 Sent to the pharmacy\");\n  renderSent();\n});\n\n// ---------- Views: New Rx | Activity ----------\nfunction view(v) {\n  $(\"v-new\").classList.toggle(\"hidden\", v !== \"new\"); $(\"v-activity\").classList.toggle(\"hidden\", v !== \"activity\");\n  document.querySelectorAll(\"[data-view]\").forEach(function (a) { a.classList.toggle(\"on\", a.dataset.view === v); });\n  if (v === \"new\" && !$(\"s-done\").classList.contains(\"hidden\")) newScript();\n  renderSent(); window.scrollTo(0, 0);\n}\ndocument.addEventListener(\"click\", function (e) { var v = e.target.closest(\"[data-view]\"); if (v) view(v.dataset.view); });\n$(\"conv-back\").addEventListener(\"click\", function () { open = null; renderSent(); });\n\n// Live updates from the pharmacy\nonRxChange(function (list) {\n  var before = renderSent.last || 0, mine = list.filter(function (r) { return r.msgs.length; });\n  var total = mine.reduce(function (n, r) { return n + r.msgs.length; }, 0);\n  if (total > before && before) {\n    var fresh = list.map(function (r) { return r.msgs[r.msgs.length - 1]; }).filter(function (m) { return m && m.from === \"pharmacy\"; }).pop();\n    if (fresh) toast(\"💬 <b>Pharmacy<\/b>: \" + fresh.text);\n  }\n  renderSent.last = total;\n  renderSent();\n});\n\n// ---------- Start ----------\nrefresh();\nportalLogin(\"prescriber\", function () {\n  $(\"who\").textContent = LOGIN.prescriber.name + \" · \" + LOGIN.prescriber.org;\n  renderSent.last = readRx().reduce(function (n, r) { return n + r.msgs.length; }, 0);\n  renderSent();\n});\n"}, "schedule": {"label": "Scheduling", "ic": "📅", "phone": false, "cls": "", "title": "Linkt · Scheduling", "body": "\n\n  <header class=\"topbar\">\n    <div class=\"brand\"><span class=\"logo\"><\/span> Linkt <span class=\"role-tag\">Scheduling<\/span><\/div>\n    <nav class=\"nav\"><a class=\"on\">Visits<\/a><a>Referrals<\/a><a>Patients<\/a><\/nav>\n    <div class=\"who\" id=\"who\"><\/div>\n    <a class=\"restart\" href=\"#\" data-reset>↺ Reset<\/a>\n  <\/header>\n\n  <main class=\"page\">\n    <div class=\"two-col\">\n      <div class=\"stack\">\n        <div class=\"card pad\">\n          <div class=\"card-title\">📥 New referrals<\/div>\n          <div id=\"ref-list\"><\/div>\n        <\/div>\n\n        <form class=\"card pad sch-form\" id=\"sch-form\">\n          <div class=\"card-title\">New visit<\/div>\n          <div class=\"fields\">\n            <label class=\"fld wide\"><span>Patient name<\/span><input id=\"f-name\" required autocomplete=\"off\"><\/label>\n            <label class=\"fld\"><span>Mobile phone<\/span><input id=\"f-phone\" autocomplete=\"off\"><\/label>\n            <label class=\"fld\"><span>Visit time<\/span><input id=\"f-time\" placeholder=\"10:30 AM\" autocomplete=\"off\"><\/label>\n            <label class=\"fld wide\"><span>Home address<\/span><input id=\"f-addr\" autocomplete=\"off\"><\/label>\n            <label class=\"fld\"><span>Visit type<\/span>\n              <select id=\"f-type\"><option>Post-discharge (TCM)<\/option><option>New patient<\/option><option>Routine follow-up<\/option><option>Urgent<\/option><\/select><\/label>\n            <label class=\"fld\"><span>Clinician<\/span><select id=\"f-np\"><option>Rosa Diaz, NP<\/option><\/select><\/label>\n            <label class=\"fld wide\"><span>Reason<\/span><input id=\"f-reason\" autocomplete=\"off\"><\/label>\n          <\/div>\n          <div class=\"card-title v-sub\">Documents for the NP<\/div>\n          <label class=\"drop sm-drop\"><input type=\"file\" id=\"f-docs\" multiple hidden><span class=\"drop-ic\">📎<\/span><span><b>Attach discharge papers, referral, labs<\/b><br><span class=\"muted\">AI organizes them before the visit<\/span><\/span><\/label>\n          <ul class=\"files\" id=\"f-doc-list\"><\/ul>\n          <label class=\"ck\"><input type=\"checkbox\" id=\"f-remind\" checked> <span>Automatic texts to the patient or their caregiver: reminders 3 days and 1 day before, and \"Reply YES to confirm\" 3 hours before. <span class=\"muted\">No reply? Text again, AI call or call with one tap.<\/span><\/span><\/label>\n          <button class=\"btn btn-big full\" id=\"f-save\">Add to Rosa's schedule<\/button>\n        <\/form>\n      <\/div>\n\n      <div class=\"card pad\">\n        <div class=\"card-title\">🗓️ Rosa Diaz, NP · today's route<\/div>\n        <div id=\"route-out\"><\/div>\n        <div id=\"sch-list\"><\/div>\n        <div class=\"fine left\">Rosa sees this on her phone instantly: tap to drive, text \"on my way\", and open the visit.<\/div>\n        <div class=\"fine left\">🔒 Your role (scheduler) sees names, addresses, phones and the visit reason only. Clinical notes are hidden (minimum necessary). You can attach documents but not open them.<\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "// Agency MA schedules home visits: referral in → visit with address, phone and documents →\n// shows up on the NP's phone, ready to drive to.\n\nvar docs = [];\n\nfunction schedule() {\n  try { var s = JSON.parse(localStorage.getItem(SCHEDULE_KEY)); if (s) return s; } catch (e) {}\n  // First time: Harold is already booked; Maria is a new referral waiting in the inbox\n  return VISITS.filter(function (v) { return v.id !== \"maria\"; });\n}\nfunction saveSchedule(list) { localStorage.setItem(SCHEDULE_KEY, JSON.stringify(list)); }\nfunction mapLink(addr) { return \"https://www.google.com/maps/dir/?api=1&destination=\" + encodeURIComponent(addr); }\nfunction toMin(t) { var m = /(\\d+):(\\d+)\\s*(AM|PM)/i.exec(t || \"\") || [0, 12, 0, \"PM\"]; return (+m[1] % 12 + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + +m[2]; }\n\nfunction render() {\n  var list = schedule().slice().sort(function (a, b) { return toMin(a.time) - toMin(b.time); });\n  var booked = list.some(function (v) { return v.id === REFERRAL.id; });\n  $(\"ref-list\").innerHTML = booked ? '<div class=\"muted\">No new referrals 🎉<\/div>' :\n    '<div class=\"ref\"><div><b>' + REFERRAL.name + '<\/b> · ' + REFERRAL.type + '<div class=\"muted\">' + REFERRAL.from + '<\/div>' +\n    '<div class=\"vals\">' + REFERRAL.docs.map(function (d) { return \"<span>📎 \" + d + \"<\/span>\"; }).join(\"\") + '<\/div><\/div>' +\n    '<button class=\"btn small-btn\" id=\"ref-use\" type=\"button\">Schedule →<\/button><\/div>';\n  var cf = confirms(), ok = list.filter(function (v) { return (cf[v.id] || {}).st === \"confirmed\"; }).length, r = routeGain(list);\n  $(\"route-out\").innerHTML = '<div class=\"route-banner\"><div><div class=\"hero-num\">' + ok + '/' + list.length + '<\/div><div class=\"hero-sub\">visits confirmed today' + (list.length - ok ? ' · <span class=\"neg\">' + (list.length - ok) + ' not yet<\/span>' : ' · <b>all set<\/b>') + '<\/div><\/div>' +\n    (r.saveMin > 4 ? '<button type=\"button\" class=\"btn\" id=\"opt-btn\">⚡ Optimize route · save ' + r.saveMin + ' min<\/button>' : '<span class=\"pill approved\">✓ Route optimized · ' + r.miles + ' mi<\/span>') + '<\/div>';\n  $(\"sch-list\").innerHTML = list.map(function (v, i) {\n    var c = cf[v.id] || { log: [] }, sent = c.log.map(function (l) { return l[1]; }).join(\" \");\n    return '<div class=\"sch-row\"><div class=\"sch-n\">' + (i + 1) + '<\/div><div><b>' + v.time + ' · ' + v.name + '<\/b><div class=\"muted\">' + v.address + '<\/div>' +\n      '<div class=\"muted\">' + (v.reason || \"\") + ' · texts go to ' + contactOf(v).to + '<\/div>' +\n      (v.docs ? '<div class=\"vals\">' + v.docs.map(function (d) { return \"<span>📎 \" + d + \"<\/span>\"; }).join(\"\") + '<\/div>' : \"\") +\n      '<div class=\"remind-plan\">' + REMIND_PLAN.map(function (p) { var done = p[0] === \"3d\" ? /3-day/.test(sent) : p[0] === \"1d\" ? /1-day/.test(sent) : /Confirmation text|AI call|Called/.test(sent); return '<span class=\"' + (done ? \"done\" : \"\") + '\">' + (done ? \"✓ \" : \"\") + p[1] + '<\/span>'; }).join(\"\") + '<\/div>' +\n      confirmPill(v) + confirmActs(v) + '<\/div>' +\n      '<a class=\"restart\" href=\"' + mapLink(v.address) + '\" target=\"_blank\" rel=\"noopener\">🧭 ' + (v.drive || \"Map\") + '<\/a><\/div>';\n  }).join(\"\");\n}\n\n// ---------- Route: shortest loop from the office, then new times ----------\nfunction geo(v) { if (VISIT_GEO[v.id]) return VISIT_GEO[v.id]; var h = 0; for (var i = 0; i < v.name.length; i++) h = (h * 31 + v.name.charCodeAt(i)) % 997; return [h % 13 - 6, (h >> 3) % 13 - 6]; }\nfunction dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]) * 1.3; }\nfunction routeMiles(list) { var at = VISIT_GEO.office, m = 0; list.forEach(function (v) { m += dist(at, geo(v)); at = geo(v); }); return m; }\nfunction bestOrder(list) {\n  var left = list.slice(), at = VISIT_GEO.office, out = [];\n  while (left.length) { left.sort(function (a, b) { return dist(at, geo(a)) - dist(at, geo(b)); }); out.push(left.shift()); at = geo(out[out.length - 1]); }\n  return out;\n}\nfunction routeGain(list) { var a = routeMiles(list), b = routeMiles(bestOrder(list)); return { miles: Math.round(b), saveMin: Math.round((a - b) * 2.4), saveMi: Math.round(a - b) }; }\nfunction fmt(m) { var h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + \":\" + (mm < 10 ? \"0\" : \"\") + mm + \" \" + (h < 12 ? \"AM\" : \"PM\"); }\ndocument.addEventListener(\"click\", function (e) {\n  if (e.target.id !== \"opt-btn\") return;\n  var list = schedule().slice().sort(function (a, b) { return toMin(a.time) - toMin(b.time); }), g = routeGain(list), at = VISIT_GEO.office, t = 9 * 60;\n  var moved = [];\n  var next = bestOrder(list).map(function (v) {\n    var d = Math.round(dist(at, geo(v)) * 2.4); t += d; at = geo(v);\n    var nv = Object.assign({}, v, { time: fmt(Math.ceil(t / 15) * 15), drive: d + \" min\" });\n    if (nv.time !== v.time) moved.push(nv);\n    t = Math.ceil(t / 15) * 15 + 50; return nv;\n  });\n  saveSchedule(next);\n  logAccess(\"scheduler\", \"Optimized today's route · saved \" + g.saveMin + \" min\");\n  toast(\"⚡ Route optimized · \" + g.saveMi + \" fewer miles · new times texted to \" + moved.length + \" patient\" + (moved.length === 1 ? \"\" : \"s\"));\n  moved.forEach(function (v) { confirmText(v); });\n  render();\n});\nwindow.onConfirmChange = function () { render(); };\n\n// One tap fills the form from the referral\ndocument.addEventListener(\"click\", function (e) {\n  if (e.target.id !== \"ref-use\") return;\n  $(\"f-name\").value = REFERRAL.name;\n  $(\"f-phone\").value = REFERRAL.phone;\n  $(\"f-addr\").value = REFERRAL.address;\n  $(\"f-time\").value = REFERRAL.time;\n  $(\"f-type\").value = REFERRAL.type;\n  $(\"f-reason\").value = REFERRAL.reason;\n  docs = REFERRAL.docs.slice();\n  renderDocs();\n  document.querySelectorAll(\"#sch-form .fld\").forEach(function (f) { f.classList.add(\"filled\"); });\n  $(\"f-save\").scrollIntoView({ behavior: \"smooth\", block: \"center\" });\n});\n\nfunction renderDocs() {\n  $(\"f-doc-list\").innerHTML = docs.map(function (d) { return '<li class=\"read\"><span class=\"file-ic\">📎<\/span><span class=\"file-name\">' + d + '<\/span><span class=\"file-st\">✓ attached<\/span><\/li>'; }).join(\"\");\n}\n$(\"f-docs\").addEventListener(\"change\", function (e) {\n  Array.prototype.forEach.call(e.target.files, function (f) { docs.push(f.name); });\n  renderDocs();\n});\n\n$(\"sch-form\").addEventListener(\"submit\", function (e) {\n  e.preventDefault();\n  var name = $(\"f-name\").value.trim();\n  if (!name) return;\n  var list = schedule(), id = name.toLowerCase() === REFERRAL.name.toLowerCase() ? REFERRAL.id : \"p\" + Date.now();\n  list = list.filter(function (v) { return v.id !== id; });\n  list.push({ id: id, name: name, phone: $(\"f-phone\").value.trim(), address: $(\"f-addr\").value.trim(), time: $(\"f-time\").value.trim() || \"3:00 PM\",\n    reason: $(\"f-type\").value + ($(\"f-reason\").value ? \" · \" + $(\"f-reason\").value.trim() : \"\"), docs: docs.slice(), by: LOGIN.scheduler.name, drive: id === REFERRAL.id ? REFERRAL.drive : \"\" });\n  saveSchedule(list);\n  if ($(\"f-remind\").checked) {\n    setConfirm(id, function (c) { c.log.push([clock(), \"Booked · reminders set: 3-day, 1-day, confirm 3 hours before\"]); });\n    confirmText(findVisit(id));\n  }\n  logAccess(\"scheduler\", \"Scheduled home visit for \" + name + (docs.length ? \" · attached \" + docs.length + \" documents\" : \"\"));\n  toast(\"📅 Added to Rosa's phone · \" + name + \" at \" + ($(\"f-time\").value || \"3:00 PM\"));\n  $(\"sch-form\").reset(); docs = []; renderDocs();\n  document.querySelectorAll(\"#sch-form .fld\").forEach(function (f) { f.classList.remove(\"filled\"); });\n  render();\n});\n\n$(\"who\").textContent = LOGIN.scheduler.name + \" · \" + LOGIN.scheduler.org;\nrender();\nwindow.addEventListener(\"storage\", function (e) { if (e.key === SCHEDULE_KEY) render(); });\nportalLogin(\"scheduler\");\n"}, "visit": {"label": "Home visit NP", "ic": "🩺", "phone": true, "cls": "visit-page", "title": "Linkt · Home visit", "body": "\n\n  <header class=\"topbar\">\n    <div class=\"brand\"><span class=\"logo\"><\/span> Linkt <span class=\"role-tag\">Home visit<\/span><\/div>\n    <div class=\"who\" id=\"who\"><\/div>\n    <button class=\"net-pill\" id=\"net\" type=\"button\" title=\"Tap to try offline mode\">📶 Online<\/button>\n    <button class=\"net-pill plan-pill\" id=\"plan-btn\" type=\"button\">⭐ Trial<\/button>\n    <a class=\"restart\" href=\"#\" data-reset>↺ Reset<\/a>\n  <\/header>\n\n  <main class=\"v-wrap\">\n    <div class=\"v-queue hidden\" id=\"v-queue\"><\/div>\n    <!-- Today's visits -->\n    <section id=\"v-today\">\n      <div class=\"seg v-tabs\" id=\"v-tabs\"><button type=\"button\" class=\"on\" data-vt=\"visits\">🗓️ Visits<\/button><button type=\"button\" class=\"full-only\" data-vt=\"queue\">📋 Queue <span class=\"soon\">add-on<\/span><\/button><button type=\"button\" class=\"full-only\" data-vt=\"scores\">📈 Scores<\/button><\/div>\n      <div id=\"scores-view\" class=\"hidden\"><\/div>\n      <div id=\"queue-view\" class=\"hidden\"><\/div>\n      <div id=\"visits-view\">\n      <div class=\"v-h1\">Today's visits<\/div>\n      <label class=\"snap-sched\"><input type=\"file\" id=\"snap-input\" accept=\"image/*,.pdf\" capture=\"environment\" hidden>📷 No scheduler? Snap your list or a referral fax<\/label>\n      <button class=\"link-btn\" id=\"snap-sample\" type=\"button\">Use a sample list<\/button>\n      <form class=\"v-search\" id=\"v-search\"><input id=\"v-q\" placeholder=\"🔎 Find a patient\" autocomplete=\"off\"><\/form>\n      <div id=\"v-found\"><\/div>\n      <div id=\"v-list\"><\/div>\n      <div class=\"v-free\">🆓 Free for visiting clinicians · no setup, no contract<\/div>\n      <\/div>\n    <\/section>\n\n    <!-- One visit, top to bottom -->\n    <section class=\"hidden\" id=\"v-visit\">\n      <button class=\"pp-back\" id=\"v-back\">‹ Today<\/button>\n      <div class=\"v-pt\">\n        <div class=\"avatar\" id=\"v-av\">?<\/div>\n        <div><div class=\"v-name\" id=\"v-name\">New patient<\/div><div class=\"muted\" id=\"v-meta\"><\/div><\/div>\n        <span class=\"v-sync\">🔒 Saved encrypted<\/span>\n      <\/div>\n\n      <!-- 1. Cards -->\n      <div class=\"v-step\" id=\"s-cards\">\n        <div class=\"v-step-h\"><span class=\"v-num\">1<\/span> ID &amp; insurance cards <span class=\"v-done hidden\">✓<\/span><\/div>\n        <div id=\"cards-capture\">\n          <label class=\"v-big\">\n            <input type=\"file\" id=\"cards-input\" accept=\"image/*\" capture=\"environment\" multiple hidden>\n            📷 Scan ID &amp; Medicare cards\n          <\/label>\n          <div class=\"link-row\"><button class=\"link-btn\" id=\"cards-sample\">Use sample cards<\/button><button class=\"link-btn\" id=\"cards-type\">Type name &amp; DOB instead<\/button><\/div>\n        <\/div>\n        <div class=\"v-cards hidden\" id=\"cards-scan\"><\/div>\n        <div class=\"fields hidden\" id=\"cards-fields\"><\/div>\n        <div class=\"v-note hidden\" id=\"cards-saved\"><\/div>\n      <\/div>\n\n      <!-- 2. Discharge papers: AI reads every page so the NP doesn't have to -->\n      <div class=\"v-step locked\" id=\"s-dc\">\n        <div class=\"v-step-h\"><span class=\"v-num\">2<\/span> Hospital discharge papers <span class=\"v-done hidden\">✓<\/span><\/div>\n        <div id=\"dc-capture\">\n          <label class=\"v-big\">\n            <input type=\"file\" id=\"dc-input\" accept=\"image/*,.pdf\" capture=\"environment\" multiple hidden>\n            📄 Snap the discharge papers\n          <\/label>\n          <div class=\"link-row\"><button class=\"link-btn\" id=\"dc-sample\">Use sample papers (9 pages)<\/button><button class=\"link-btn\" id=\"dc-skip\">No recent hospital stay<\/button><\/div>\n        <\/div>\n        <div class=\"dc-pages hidden\" id=\"dc-pages\"><\/div>\n        <div class=\"hidden\" id=\"dc-sum\"><\/div>\n      <\/div>\n\n      <!-- 3. Meds -->\n      <div class=\"v-step locked\" id=\"s-meds\">\n        <div class=\"v-step-h\"><span class=\"v-num\">3<\/span> Pill bottles → med list <span class=\"v-done hidden\">✓<\/span><\/div>\n        <div id=\"meds-capture\">\n          <button class=\"v-big\" id=\"meds-video\" type=\"button\">🎥 Scan bottles with video<\/button>\n          <div class=\"muted center-txt v-small\">Pan across the table. AI reads every label on the phone, even offline.<br>🔒 The video never goes to the camera roll and is deleted right after: only the med list is kept.<\/div>\n          <div class=\"link-row center\">\n            <label class=\"link-btn\">📷 Photo instead<input type=\"file\" id=\"meds-input\" accept=\"image/*\" capture=\"environment\" multiple hidden><\/label>\n            <button class=\"link-btn\" id=\"meds-sample\">Use sample bottles<\/button>\n          <\/div>\n        <\/div>\n        <ul class=\"v-meds\" id=\"meds-list\"><\/ul>\n        <div class=\"v-note hidden\" id=\"meds-sum\"><\/div>\n      <\/div>\n\n      <!-- 4. Vitals -->\n      <div class=\"v-step locked\" id=\"s-vitals\">\n        <div class=\"v-step-h\"><span class=\"v-num\">4<\/span> Vitals <span class=\"v-done hidden\">✓<\/span><\/div>\n        <div id=\"vit-aide\"><\/div>\n        <button class=\"btn btn-soft\" id=\"vit-dev\" type=\"button\">📲 Read from devices (cuff, scale, glucometer)<\/button>\n        <div class=\"vit-grid\" id=\"vit-grid\"><\/div>\n      <\/div>\n\n      <!-- 5. Voice note -->\n      <div class=\"v-step locked\" id=\"s-note\">\n        <div class=\"v-step-h\"><span class=\"v-num\">5<\/span> Visit note <span class=\"v-done hidden\">✓<\/span><\/div>\n        <div id=\"note-capture\">\n          <button class=\"v-mic\" id=\"mic\">🎙️<\/button>\n          <div class=\"muted center-txt\" id=\"mic-hint\">Ask first: “OK if I record to write my note?” Then tap and talk.<br>The audio is deleted once you sign the note.<\/div>\n          <div class=\"link-row center\"><button class=\"link-btn\" id=\"note-sample\">Use sample note<\/button><button class=\"link-btn\" id=\"note-type\">Type instead<\/button><\/div>\n        <\/div>\n        <textarea class=\"v-text hidden\" id=\"note-text\" placeholder=\"Type the visit note…\"><\/textarea>\n        <button class=\"btn hidden\" id=\"note-go\">Write it up<\/button>\n        <div class=\"v-transcript hidden\" id=\"transcript\"><\/div>\n        <div class=\"v-soap hidden\" id=\"soap\"><\/div>\n      <\/div>\n\n      <!-- 4. Prescription + coverage -->\n      <div class=\"v-step locked full-only\" id=\"s-rx\">\n        <div class=\"v-step-h\"><span class=\"v-num\">6<\/span> New prescription &amp; coverage <span class=\"v-done hidden\">✓<\/span><\/div>\n        <form class=\"drug-form\" id=\"v-drug-form\"><input id=\"v-drug\" placeholder=\"Drafted from your note, or type a drug\" autocomplete=\"off\"><button class=\"btn\">Check<\/button><\/form>\n        <div class=\"v-cov hidden\" id=\"cov\"><\/div>\n      <\/div>\n\n      <!-- 5. Pharmacy + consent -->\n      <div class=\"v-step locked\" id=\"s-send\">\n        <div class=\"v-step-h\"><span class=\"v-num\">7<\/span> Pharmacy &amp; delivery <span class=\"v-done hidden\">✓<\/span><\/div>\n        <div id=\"pharm-list\" class=\"full-only\"><\/div>\n        <label class=\"ck v-ck full-only\"><input type=\"checkbox\" id=\"deliver\" checked> <span><b>Deliver to her home<\/b> <span class=\"muted\" id=\"deliver-addr\"><\/span><\/span><\/label>\n        <div class=\"card-title v-sub\">Text updates to<\/div>\n        <label class=\"ck v-ck\"><input type=\"checkbox\" id=\"t-pt\" checked> <span><b id=\"t-pt-name\"><\/b> <span class=\"muted\" id=\"t-pt-phone\"><\/span><\/span><\/label>\n        <label class=\"ck v-ck\"><input type=\"checkbox\" id=\"t-cg\" checked> <span><b id=\"t-cg-name\"><\/b> <span class=\"muted\" id=\"t-cg-phone\"><\/span><\/span><\/label>\n        <div class=\"card-title v-sub\">Patient agrees<\/div>\n        <div class=\"muted v-small\" id=\"agree-txt\"><\/div>\n        <canvas class=\"v-sig\" id=\"sig-pad\" width=\"480\" height=\"120\"><\/canvas>\n        <div class=\"link-row\"><button class=\"link-btn\" id=\"sig-clear\">Clear<\/button><span class=\"muted v-small\" id=\"sig-hint\">Patient signs with a finger<\/span><\/div>\n      <\/div>\n\n      <!-- 8. Paperwork that makes the visit legal and billable -->\n      <div class=\"v-step locked\" id=\"s-leave\">\n        <div class=\"v-step-h\"><span class=\"v-num\">8<\/span> Before you leave <span class=\"v-done hidden\">✓<\/span><\/div>\n        <div id=\"leave\"><\/div>\n      <\/div>\n\n      <!-- Done -->\n      <div class=\"v-step hidden\" id=\"s-done\">\n        <div class=\"v-step-h\">✅ Done at the kitchen table <span class=\"muted\" id=\"done-time\"><\/span><\/div>\n        <ul class=\"v-check\" id=\"done-list\"><\/ul>\n        <div class=\"full-only\"><div class=\"card-title v-sub\">Where's the script?<\/div>\n        <ol class=\"track\" id=\"v-track\"><\/ol><\/div>\n        <!-- Share the visit summary with other doctors or the billing office -->\n        <div class=\"bill\" id=\"share\"><\/div>\n\n        <!-- Billing: AI builds the claim from the visit; the NP reviews and attests -->\n        <div class=\"bill full-only\" id=\"bill\"><\/div>\n        <button class=\"btn full\" id=\"v-next\">Next visit →<\/button>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <!-- Video scan of the pill bottles -->\n  <div class=\"modal hidden\" id=\"vid\">\n    <div class=\"modal-card vid-card\">\n      <div class=\"call-head\"><span class=\"call-dot\"><\/span><b>Scanning bottles<\/b><span class=\"muted\" id=\"vid-mode\"><\/span><\/div>\n      <div class=\"vid-box\">\n        <video id=\"vid-el\" playsinline muted><\/video>\n        <div class=\"vid-fake\" id=\"vid-fake\"><span>💊<\/span><span>💊<\/span><span>💊<\/span><span>💊<\/span><\/div>\n        <div class=\"scan-bar\"><\/div>\n        <div class=\"vid-tags\" id=\"vid-tags\"><\/div>\n      <\/div>\n      <ul class=\"v-check\" id=\"vid-found\"><\/ul>\n      <button class=\"btn full hidden\" id=\"vid-done\">Use these meds<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- One button does everything -->\n  <div class=\"v-bar hidden\" id=\"v-bar\"><button class=\"btn btn-big full\" id=\" ata-t=\"issues\">Issues<\/a><a data-t=\"requests\">Family requests<\/a><a data-t=\"staff\">Caregivers<\/a><a data-t=\"billing\" class=\"full-only\">Billing<\/a>\n    <\/nav>\n    <label class=\"lang-sel\">🌐 Notes in <select id=\"ag-lang\"><\/select><\/label>\n    <div class=\"who\" id=\"who\"><\/div>\n    <a class=\"restart\" href=\"#\" data-reset>↺ Reset<\/a>\n  <\/header>\n\n  <main class=\"page\">\n    <div class=\"kpis adm-kpis\" id=\"ag-kpis\"><\/div>\n    <section class=\"adm-tab\" id=\"t-today\"><\/section>\n    <section class=\"adm-tab hidden\" id=\"t-meds\"><\/section>\n    <section class=\"adm-tab hidden\" id=\"t-issues\"><\/section>\n    <section class=\"adm-tab hidden\" id=\"t-requests\"><\/section>\n    <section class=\"adm-tab hidden\" id=\"t-staff\"><\/section>\n    <section class=\"adm-tab hidden\" id=\"t-billing\"><\/section>\n  <\/main>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "// Home care agency office: live visit board (EVV), medication record, issues, family requests,\n// caregiver compliance, billing & payroll. Notes show in the reader's language.\n\nvar view = \"en\";\nfunction get(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } }\nfunction setReqs(a) { localStorage.setItem(REQUESTS_KEY, JSON.stringify(a)); }\n\nfunction dayRows() {\n  var rs = get(READINGS_KEY);\n  return AGENCY_DAY.map(function (d) {\n    if (!d.live) return d;\n    var r = rs.filter(function (x) { return x.id === d.id && x.via === \"aide\"; }).pop();\n    if (!r) return Object.assign({}, d, { status: \"scheduled\" });\n    return Object.assign({}, d, { status: \"done\", in: r.checkin, out: r.checkout, meds: r.meds, note: r.note, lang: r.lang, alerts: r.alerts });\n  });\n}\nfunction allIssues() {\n  var seeded = AGENCY_DAY.filter(function (d) { return d.issue; }).map(function (d) { return Object.assign({ pt: d.pt, by: d.aide, t: d.out, lang: d.lang }, d.issue); });\n  return get(ISSUES_KEY).concat(seeded);\n}\nfunction shown(text, lang) {\n  if (!text) return \"\";\n  var tr = translate(text, view);\n  return tr !== text ? tr + '<div class=\"tr-note\">🌐 Translated from ' + LANGS[lang || \"es\"] + ' · <a href=\"#\" data-orig=\"' + encodeURIComponent(text) + '\">show original<\/a><\/div>' : text;\n}\nfunction medPill(st) { return '<span class=\"pill ' + (st === \"Refused\" ? \"hold refused-pill\" : st === \"Not due\" ? \"working\" : \"approved\") + '\">' + st + '<\/span>'; }\n\nfunction kpis() {\n  var rows = dayRows(), issues = allIssues(), reqs = get(REQUESTS_KEY);\n  var refused = rows.reduce(function (n, r) { return n + (r.meds || []).filter(function (m) { return m[1] === \"Refused\"; }).length; }, 0);\n  $(\"ag-kpis\").innerHTML =\n    kpi(rows.filter(function (r) { return r.status === \"done\"; }).length + \"/\" + rows.length, \"visits verified (EVV)\", \"\") +\n    kpi(rows.filter(function (r) { return r.status === \"late\"; }).length, \"late / missed\", rows.some(function (r) { return r.status === \"late\"; }) ? \"warn\" : \"good\") +\n    kpi(refused, \"refused medications\", refused ? \"warn\" : \"good\") +\n    kpi(issues.length + reqs.filter(function (q) { return q.status !== \"Done\"; }).length, \"open issues & requests\", \"\");\n}\nfunction kpi(n, l, c) { return '<div class=\"kpi ' + c + '\"><div class=\"kpi-num\">' + n + '<\/div><div class=\"kpi-label\">' + l + '<\/div><\/div>'; }\n\nfunction renderToday() {\n  $(\"t-today\").innerHTML = '<div class=\"card pad\"><div class=\"card-title\">🗓️ Today\\'s visits · live from caregivers\\' phones<\/div>' +\n    dayRows().map(function (r) {\n      var st = r.status === \"done\" ? '<span class=\"pill approved\">✓ ' + r.in + '–' + r.out + ' · verified<\/span>'\n        : r.status === \"late\" ? '<span class=\"pill hold refused-pill\">⚠️ Not checked in · 18 min late<\/span>'\n        : '<span class=\"pill working\">Scheduled<\/span>';\n      return '<div class=\"adm-row\"><div><b>' + r.time + ' · ' + r.pt + '<\/b> <span class=\"muted\">· ' + r.aide + '<\/span>' +\n        (r.meds ? '<div class=\"vals\">' + r.meds.map(function (m) { return '<span class=\"' + (m[1] === \"Refused\" ? \"bad\" : \"\") + '\">💊 ' + m[0].split(\" \")[0] + ': ' + m[1] + '<\/span>'; }).join(\"\") + '<\/div>' : \"\") +\n        (r.alerts && r.alerts.length ? '<div class=\"v-flag\">⚠️ ' + r.alerts.join(\" · \") + '<\/div>' : \"\") +\n        (r.note ? '<div class=\"ag-note\">📝 ' + shown(r.note, r.lang) + '<\/div>' : \"\") + '<\/div>' +\n        '<div class=\"adm-acts\">' + st + (r.status === \"late\" ? '<button class=\"btn small-btn btn-soft\" data-late=\"call\">📞 Call aide<\/button><button class=\"btn small-btn\" data-late=\"backup\">Send backup<\/button>' : \"\") + '<\/div><\/div>';\n    }).join(\"\") + '<\/div>';\n}\n\nfunction renderMeds() {\n  var rows = dayRows().filter(function (r) { return r.meds; });\n  $(\"t-meds\").innerHTML = '<div class=\"card pad\"><div class=\"card-title\">💊 Medication record · today<\/div>' +\n    '<div class=\"fine left\">Aides remind or assist (they don\\'t give injections or decide doses; that\\'s nursing). Refusals alert the NP and family.<\/div>' +\n    '<table class=\"audit\"><thead><tr><th>Patient<\/th><th>Medication<\/th><th>Status<\/th><th>By<\/th><\/tr><\/thead><tbody>' +\n    rows.map(function (r) { return r.meds.map(function (m) { return '<tr' + (m[1] === \"Refused\" ? ' class=\"flag-row\"' : \"\") + '><td><b>' + r.pt + '<\/b><\/td><td>' + m[0] + '<\/td><td>' + medPill(m[1]) + '<\/td><td class=\"muted\">' + r.aide + ' · ' + r.out + '<\/td><\/tr>'; }).join(\"\"); }).join(\"\") +\n    '<\/tbody><\/table>' + (rows.length ? \"\" : '<div class=\"muted\">No medication records yet today.<\/div>') + '<\/div>';\n}\n\nvar resolved = {};\nfunction renderIssues() {\n  var list = allIssues();\n  $(\"t-issues\").innerHTML = '<div class=\"card pad\"><div class=\"card-title\">⚠️ Issues reported by caregivers<\/div>' +\n    list.map(function (i, n) {\n      var id = i.pt + i.type + n;\n      return '<div class=\"adm-row\"><div><b>' + i.type + '<\/b> · ' + i.sev + ' <span class=\"muted\">· ' + i.pt + ' · ' + i.by + ' · ' + (i.t || \"\") + '<\/span>' +\n        (i.text ? '<div class=\"ag-note\">' + shown(i.text, i.lang) + '<\/div>' : \"\") + '<\/div>' +\n        (resolved[id] ? '<span class=\"pill approved\">' + resolved[id] + '<\/span>' :\n          '<div class=\"adm-acts\"><button class=\"btn small-btn btn-soft\" data-iss=\"' + id + '\" data-v=\"NP notified\">Notify NP<\/button><button class=\"btn small-btn btn-soft\" data-iss=\"' + id + '\" data-v=\"Family notified\">Notify family<\/button><button class=\"btn small-btn\" data-iss=\"' + id + '\" data-v=\"✓ Resolved\">Resolved<\/button><\/div>') + '<\/div>';\n    }).join(\"\") + (list.length ? \"\" : '<div class=\"muted\">No issues reported today.<\/div>') + '<\/div>';\n}\n\nfunction renderRequests() {\n  var reqs = get(REQUESTS_KEY);\n  $(\"t-requests\").innerHTML = '<div class=\"card pad\"><div class=\"card-title\">👪 Requests from family caregivers<\/div>' +\n    reqs.map(function (q, n) {\n      return '<div class=\"adm-row\"><div><b>' + q.text + '<\/b><div class=\"muted\">' + q.from + ' for ' + q.pt + ' · ' + q.t + (q.doneBy ? ' · done by ' + q.doneBy + ' at ' + q.doneAt : \"\") + '<\/div><\/div>' +\n        (q.status === \"Done\" ? '<span class=\"pill approved\">✓ Done · family notified<\/span>' :\n          q.status === \"Assigned\" ? '<div class=\"adm-acts\"><span class=\"pill working\">Assigned to ' + q.to + '<\/span><button class=\"btn small-btn btn-soft\" data-req=\"' + n + '\" data-v=\"done\">Mark done<\/button><\/div>' :\n          '<div class=\"adm-acts\"><button class=\"btn small-btn\" data-req=\"' + n + '\" data-v=\"assign\">Assign to Tina<\/button><button class=\"btn small-btn btn-soft\" data-req=\"' + n + '\" data-v=\"np\">Send to NP<\/button><\/div>') + '<\/div>';\n    }).join(\"\") + (reqs.length ? \"\" : '<div class=\"muted\">No requests yet. Family members send them from the family app.<\/div>') + '<\/div>';\n}\n\nfunction renderStaff() {\n  $(\"t-staff\").innerHTML = '<div class=\"card pad\"><div class=\"card-title\">🧑‍⚕️ Caregivers · certifications &amp; languages<\/div>' +\n    CAREGIVERS.map(function (c) {\n      return '<div class=\"adm-row\"><div><b>' + c.name + '<\/b> <span class=\"muted\">· speaks ' + c.langs + ' · ' + c.hours + ' h this week<\/span><div class=\"vals\">' +\n        c.certs.map(function (x) { return '<span class=\"' + (x[1] === \"ok\" ? \"\" : \"bad\") + '\">' + (x[1] === \"ok\" ? \"✓ \" : \"⚠️ \") + x[0] + (x[1] === \"ok\" ? \"\" : \": \" + x[1]) + '<\/span>'; }).join(\"\") + '<\/div><\/div>' +\n        (c.certs.some(function (x) { return x[1] !== \"ok\"; }) ? '<button class=\"btn small-btn btn-soft\" data-remind=\"' + c.name + '\">Send reminder<\/button>' : '<span class=\"pill approved\">Up to date<\/span>') + '<\/div>';\n    }).join(\"\") + '<div class=\"fine left\">Also tracked: state aide registry, TB test, background check, yearly training hours, license checks. Expiring items block scheduling until renewed.<\/div><\/div>';\n}\n\nfunction renderBilling() {\n  var done = dayRows().filter(function (r) { return r.status === \"done\"; });\n  var mins = done.length * 65, units = Math.round(mins / 15);\n  $(\"t-billing\").innerHTML = '<div class=\"result-grid\">' +\n    '<div class=\"card pad\"><div class=\"card-title\">💵 Billing from verified visits<\/div>' +\n      '<div class=\"dc-row\"><span>✅<\/span><span>' + done.length + ' visits EVV-verified today (time, place, service, caregiver, patient)<\/span><\/div>' +\n      '<div class=\"dc-row\"><span>🏛️<\/span><span>Medicaid personal care: ' + units + ' units (15 min) → sent through the state\\'s EVV system<\/span><\/div>' +\n      '<div class=\"dc-row\"><span>🏥<\/span><span>Medicare home health: visits count toward each patient\\'s 30-day period under the NP-signed plan of care<\/span><\/div>' +\n      '<div class=\"dc-row\"><span>🧾<\/span><span>Private pay & long-term care insurance: invoices built automatically<\/span><\/div>' +\n      '<button class=\"btn full\" id=\"ag-submit\">Submit verified visits<\/button><ul class=\"v-check hidden\" id=\"ag-log\"><\/ul><\/div>' +\n    '<div class=\"card pad\"><div class=\"card-title\">⏱️ Payroll<\/div>' +\n      CAREGIVERS.map(function (c) { return '<div class=\"dc-row\"><span>•<\/span><span>' + c.name + '<\/span><span class=\"muted\">' + c.hours + ' h · from EVV, no timesheets<\/span><\/div>'; }).join(\"\") +\n      '<div class=\"fine left\">Hours come straight from check-in/check-out, so payroll and billing always match.<\/div><\/div><\/div>';\n}\n\nfunction renderAll() { kpis(); renderToday(); renderMeds(); renderIssues(); renderRequests(); renderStaff(); renderBilling(); }\n\ndocument.addEventListener(\"click\", function (e) {\n  var t = e.target.closest(\"[data-t]\");\n  if (t) {\n    document.querySelectorAll(\"#ag-nav a\").forEach(function (a) { a.classList.toggle(\"on\", a === t); });\n    document.querySelectorAll(\".adm-tab\").forEach(function (s) { s.classList.toggle(\"hidden\", s.id !== \"t-\" + t.dataset.t); });\n    return;\n  }\n  var o = e.target.closest(\"[data-orig]\");\n  if (o) { e.preventDefault(); o.closest(\".tr-note\").innerHTML = \"Original: \" + decodeURIComponent(o.dataset.orig); return; }\n  var i = e.target.closest(\"[data-iss]\");\n  if (i) { resolved[i.dataset.iss] = i.dataset.v; logAccess(\"agency\", \"Issue: \" + i.dataset.v); toast(\"✓ \" + i.dataset.v); return renderIssues(); }\n  var l = e.target.closest(\"[data-late]\");\n  if (l) { toast(l.dataset.late === \"call\" ? \"📞 Calling Marta Silva\" : \"🚗 Backup caregiver Ana Torres sent · family notified\"); logAccess(\"agency\", \"Late visit: \" + l.dataset.late); return; }\n  var r = e.target.closest(\"[data-remind]\");\n  if (r) { toast(\"📨 Renewal reminder sent to \" + r.dataset.remind); return; }\n  var q = e.target.closest(\"[data-req]\");\n  if (q) {\n    var reqs = get(REQUESTS_KEY), x = reqs[+q.dataset.req];\n    if (q.dataset.v === \"assign\") { x.status = \"Assigned\"; x.to = \"Tina Brooks, HHA\"; toast(\"✓ Assigned to Tina · shows on her phone\"); }\n    if (q.dataset.v === \"np\") { x.status = \"Assigned\"; x.to = \"Rosa Diaz, NP\"; toast(\"✓ Sent to Rosa Diaz, NP\"); }\n    if (q.dataset.v === \"done\") { x.status = \"Done\"; x.doneBy = LOGIN.agency.name; x.doneAt = clock(); toast(\"✓ Done · \" + x.from.split(\" \")[0] + \" notified\"); }\n    setReqs(reqs); logAccess(\"agency\", \"Family request “\" + x.text + \"” → \" + x.status);\n    return renderAll();\n  }\n  if (e.target.id === \"ag-submit\") {\n    e.target.disabled = true; $(\"ag-log\").classList.remove(\"hidden\");\n    [\"Checked against EVV rules · 0 errors\", \"Medicaid visits sent to the state EVV system\", \"Private-pay invoices emailed\", \"Payroll hours exported\"].forEach(function (s, n) {\n      setTimeout(function () { $(\"ag-log\").insertAdjacentHTML(\"beforeend\", \"<li>✓ \" + s + \"<\/li>\"); }, 400 * (n + 1));\n    });\n    logAccess(\"agency\", \"Submitted verified visits for billing\");\n  }\n});\n\n$(\"ag-lang\").innerHTML = Object.keys(LANGS).map(function (k) { return '<option value=\"' + k + '\">' + LANGS[k] + '<\/option>'; }).join(\"\");\n$(\"ag-lang\").addEventListener(\"change\", function () { view = this.value; renderAll(); });\nwindow.addEventListener(\"storage\", function (e) { if ([READINGS_KEY, ISSUES_KEY, REQUESTS_KEY].indexOf(e.key) !== -1) renderAll(); });\n$(\"who\").textContent = LOGIN.agency.name;\nrenderAll();\nportalLogin(\"agency\");\n"}, "family": {"label": "Family", "ic": "👪", "phone": true, "cls": "visit-page", "title": "Linkt · Family", "body": "\n\n  <header class=\"topbar\">\n    <div class=\"brand\"><span class=\"logo\"><\/span> Linkt <span class=\"role-tag\">Family<\/span><\/div>\n    <div class=\"who\" id=\"who\"><\/div>\n    <a class=\"restart\" href=\"#\" data-reset>↺ Reset<\/a>\n  <\/header>\n\n  <main class=\"v-wrap\">\n    <div class=\"v-pt\">\n      <div class=\"avatar\">ML<\/div>\n      <div><div class=\"v-name\">Maria Lopez<\/div><div class=\"muted\">Your mom · you're her authorized caregiver<\/div><\/div>\n    <\/div>\n    <div class=\"fam-consent\">🔒 Maria allowed you to see visits, medications, readings and prescriptions. <a href=\"#\" id=\"fam-scope\">What you can't see<\/a><\/div>\n\n    <div class=\"v-step\">\n      <div class=\"v-step-h\">🙋 Ask for something<\/div>\n      <div class=\"chips\" id=\"fam-asks\"><\/div>\n      <form class=\"drug-form\" id=\"fam-ask-form\"><input id=\"fam-ask\" placeholder=\"Type a request…\" autocomplete=\"off\"><button class=\"btn\">Send<\/button><\/form>\n      <div id=\"fam-reqs\"><\/div>\n    <\/div>\n\n    <div class=\"v-step\">\n      <div class=\"v-step-h\">✍️ Add an update<\/div>\n      <form class=\"drug-form\" id=\"fam-up-form\"><input id=\"fam-up\" placeholder=\"e.g. BP 148/90 tonight, she ate dinner\" autocomplete=\"off\"><button class=\"btn\">Add<\/button><\/form>\n      <div class=\"fine left\">Readings you add go to her nurse practitioner. In an emergency, call 911.<\/div>\n    <\/div>\n\n    <div class=\"v-step\">\n      <div class=\"v-step-h\">🔔 What's been done<\/div>\n      <div id=\"fam-feed\"><\/div>\n    <\/div>\n  <\/main>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "// Family caregiver app: everything that was done for Mom, in one feed; add updates; ask for things.\n// Shows only what the patient authorized (HIPAA lets patients name family members to receive information).\n\nfunction get(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } }\nvar seen = -1;\n\nfunction feed() {\n  var items = [];\n  get(READINGS_KEY).filter(function (r) { return r.id === \"maria\"; }).forEach(function (r) {\n    if (r.via === \"aide\") {\n      items.push({ t: r.checkin, ic: \"🧑‍⚕️\", txt: \"<b>\" + r.by + \"<\/b> arrived (\" + r.checkin + \"–\" + r.checkout + \")\" });\n      if (r.meds) items.push({ t: r.checkout, ic: \"💊\", txt: r.meds.map(function (m) { return m[0].split(\" \")[0] + \": \" + m[1].toLowerCase(); }).join(\" · \"), bad: r.meds.some(function (m) { return m[1] === \"Refused\"; }) });\n      items.push({ t: r.checkout, ic: \"❤️\", txt: Object.keys(r.vals).map(function (k) { return k.toUpperCase() + \" \" + r.vals[k]; }).join(\" · \"), bad: r.alerts && r.alerts.length });\n      if (r.tasks && r.tasks.length) items.push({ t: r.checkout, ic: \"✅\", txt: \"Done: \" + r.tasks.join(\", \") });\n      if (r.note) items.push({ t: r.checkout, ic: \"📝\", txt: translate(r.note, \"en\") + (r.lang === \"es\" ? ' <span class=\"muted\">(translated from Spanish)<\/span>' : \"\") });\n    } else items.push({ t: r.t, ic: \"📲\", txt: \"Reading added by \" + r.by + \": \" + Object.keys(r.vals).map(function (k) { return k.toUpperCase() + \" \" + r.vals[k]; }).join(\" · \") });\n  });\n  get(REQUESTS_KEY).filter(function (q) { return q.status === \"Done\"; }).forEach(function (q) { items.push({ t: q.doneAt, ic: \"🙌\", txt: \"Done: “\" + q.text + \"”\" + (q.doneBy ? \" · by \" + q.doneBy : \"\") }); });\n  var s = readStore();\n  if (s && s.status) items.push({ t: \"\", ic: \"💊\", txt: \"New prescription: \" + stageName(s, s.status) });\n  return items.reverse();\n}\n\nfunction render() {\n  var f = feed();\n  $(\"fam-feed\").innerHTML = f.length ? f.map(function (i) { return '<div class=\"fam-item' + (i.bad ? \" bad\" : \"\") + '\"><span>' + i.ic + '<\/span><div>' + i.txt + '<\/div><span class=\"muted\">' + (i.t || \"\") + '<\/span><\/div>'; }).join(\"\")\n    : '<div class=\"muted\">Nothing yet today. You\\'ll get a text the moment something is done.<\/div>';\n  if (seen >= 0 && f.length > seen) toast(\"🔔 \" + f[0].txt.replace(/<[^>]+>/g, \"\"));\n  seen = f.length;\n  var reqs = get(REQUESTS_KEY).filter(function (q) { return q.from === LOGIN.family.name; });\n  $(\"fam-reqs\").innerHTML = reqs.map(function (q) {\n    return '<div class=\"fam-req\"><span>' + q.text + '<\/span><span class=\"pill ' + (q.status === \"Done\" ? \"approved\" : \"working\") + '\">' + (q.status === \"Done\" ? \"✓ Done\" : q.status === \"Assigned\" ? \"With \" + q.to.split(\",\")[0] : \"Sent\") + '<\/span><\/div>';\n  }).join(\"\");\n}\n\nfunction ask(text) {\n  if (!text.trim()) return;\n  var a = get(REQUESTS_KEY);\n  a.push({ text: text.trim(), from: LOGIN.family.name, pt: \"Maria Lopez\", t: clock(), status: \"New\" });\n  localStorage.setItem(REQUESTS_KEY, JSON.stringify(a));\n  logAccess(\"family\", \"Asked: \" + text.trim());\n  toast(\"🙋 Sent to \" + HH.agency + \" · you'll be told when it's done\");\n  $(\"fam-ask\").value = \"\";\n  render();\n}\n$(\"fam-asks\").innerHTML = FAMILY_ASKS.map(function (q) { return '<button class=\"chip\" type=\"button\">' + q + '<\/button>'; }).join(\"\");\n$(\"fam-asks\").addEventListener(\"click\", function (e) { if (e.target.classList.contains(\"chip\")) ask(e.target.textContent); });\n$(\"fam-ask-form\").addEventListener(\"submit\", function (e) { e.preventDefault(); ask($(\"fam-ask\").value); });\n\n$(\"fam-up-form\").addEventListener(\"submit\", function (e) {\n  e.preventDefault();\n  var t = $(\"fam-up\").value.trim();\n  if (!t) return;\n  var v = {}, bp = t.match(/(\\d{2,3})\\s*\\/\\s*(\\d{2,3})/), g = t.match(/(?:sugar|glucose)\\D*(\\d{2,3})/i);\n  if (bp) v.bp = bp[1] + \"/\" + bp[2]; if (g) v.glu = g[1];\n  var a = get(READINGS_KEY);\n  a.push({ pt: \"Maria Lopez\", id: \"maria\", by: \"Ana (daughter)\", via: \"family\", t: clock(), vals: v, alerts: bp && +bp[1] >= LIMITS.bpSys ? [\"Blood pressure \" + v.bp + \" (high)\"] : [], note: t });\n  localStorage.setItem(READINGS_KEY, JSON.stringify(a));\n  logAccess(\"family\", \"Added an update: \" + t);\n  $(\"fam-up\").value = \"\";\n  toast(\"✓ Sent to Rosa Diaz, NP\");\n  render();\n});\n$(\"fam-scope\").addEventListener(\"click\", function (e) {\n  e.preventDefault();\n  toast(\"Not shared: therapy notes, other diagnoses, and anything Maria hasn't allowed. She can change this anytime in her portal.\");\n});\n\nwindow.addEventListener(\"storage\", render);\n$(\"who\").textContent = LOGIN.family.name;\nrender();\nportalLogin(\"family\");\n"}, "patient": {"label": "Patient", "ic": "📱", "phone": false, "cls": "patient-page", "title": "Maria's phone · Linkt texts", "body": "\n\n  <div class=\"phone-wrap\">\n    <div class=\"phone\">\n      <div class=\"phone-top\"><span id=\"phone-clock\"><\/span><span>●●● 5G<\/span><\/div>\n      <div class=\"phone-head\">\n        <div class=\"logo\"><\/div>\n        <div><b>Linkt<\/b><div class=\"muted\">Text updates · 73592<\/div><\/div>\n        <button class=\"portal-btn\" id=\"portal-btn\">🔒 My portal<\/button>\n      <\/div>\n      <div class=\"sms\" id=\"sms\"><\/div>\n      <form class=\"sms-send\" id=\"sms-send\"><input id=\"sms-in\" placeholder=\"Text a reading, e.g. BP 150/90 sugar 180\" autocomplete=\"off\"><button>↑<\/button><\/form>\n      <div class=\"pportal hidden\" id=\"pportal\"><\/div>\n    <\/div>\n\n    <div class=\"phone-side\">\n      <div class=\"brand\"><span class=\"logo\"><\/span> Linkt <span class=\"role-tag\">for Patients<\/span><\/div>\n      <h2 id=\"pt-title\"><\/h2>\n      <ol class=\"track\" id=\"track\"><\/ol>\n      <div class=\"hipaa\">\n        <b>🔒 Private by design<\/b>\n        <div class=\"muted\">Texts never name the drug or the condition. Details sit behind a secure link that asks for the date of birth. The patient opted in at the clinic and can reply STOP at any time.<\/div>\n      <\/div>\n      <a class=\"restart\" href=\"#\" data-reset>↺ Reset<\/a>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "\n    var state = null;\n\n    function render(s) {\n      state = s;\n      var pre = []; try { pre = JSON.parse(localStorage.getItem(PRETEXT_KEY)) || []; } catch (e) {}\n      var texts = pre.concat((s && s.texts) || []);\n      $(\"sms\").innerHTML = !texts.length ? '<div class
