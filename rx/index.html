<style>
  :root { --accent: #2F5BEA; --ink: #0A1128; --muted: #6F7780; --line: #E8EBED; --bg: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .tabs button, .tool { font: inherit; font-size: 14px; font-weight: 600; color: #C9D3F0; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }

  .tabs button.on { background: #FFFFFF; color: var(--ink); }
  .tabs button.side { border-color: #E8894F; }
  .tool { border-color: rgba(255,255,255,.25); }
  .tool.on { background: #E8894F; color: #1E1B16; border-color: #E8894F; }
  .stage { flex: 1; display: flex; gap: 12px; padding: 12px; min-height: 0; overflow-x: auto; }
  .pane { flex: 1; min-width: 360px; display: flex; flex-direction: column; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(30,27,22,.12); }
  .pane.phone { flex: 0 0 420px; min-width: 420px; border: 10px solid #1E1B16; border-radius: 34px; margin: 0 auto; }
  .stage.single .pane.phone { flex-basis: 430px; }
  .pane-h { font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 12px; background: #F2F4F5; display: flex; justify-content: space-between; }
  .pane-h button { font: inherit; border: none; background: none; color: var(--muted); cursor: pointer; }
  .pane iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  .hint { font-size: 12px; color: #B9CCC1; }
  .stage.single .pane.phone { flex: 1 1 auto; min-width: 0; border: 0; border-radius: 0; margin: 0; }
  @media (max-width: 700px) { .pane.phone, .stage.single .pane.phone { flex-basis: 100%; min-width: 0; border-width: 0; border-radius: 0; } .hint { display: none; } }

<script>
var PAGES = {"prescribe": {"label": "Send a script", "ic": "✍️", "phone": false, "cls": "", "title": "Linkt Rx · Prescriber", "body": "\n\n  <header class=\"topbar\">\n    <div class=\"brand\"><span class=\"logo\"><\/span> Linkt <span class=\"role-tag\">Rx<\/span><\/div>\n    <nav class=\"nav\"><a class=\"on\" data-view=\"new\">New Rx<\/a><a data-view=\"activity\">Activity <span class=\"badge-dot hidden\" id=\"act-dot\"><\/span><\/a><\/nav>\n    <div class=\"who\" id=\"who\"><\/div>\n    <a class=\"restart\" href=\"#\" data-reset>↺ Reset<\/a>\n  <\/header>\n\n  <main class=\"page\">\n    <!-- NEW PRESCRIPTION: one question per screen -->\n    <div class=\"flow\" id=\"v-new\">\n      <div class=\"flow-bar\" id=\"flow-bar\"><\/div>\n      <div class=\"flow-top\"><button type=\"button\" class=\"flow-back\" id=\"back\" aria-label=\"Back\">‹<\/button><div class=\"flow-kicker\" id=\"kicker\"><\/div><\/div>\n      <h1 id=\"flow-title\"><\/h1>\n\n      <!-- 1. Patient & insurance -->\n      <section class=\"rx-step\" id=\"s-pt\">\n        <div class=\"seg rx-how\"><button type=\"button\" data-pt=\"snap\" class=\"on\">📷 Snap card<\/button><button type=\"button\" data-pt=\"type\">⌨️ Type name<\/button><\/div>\n        <div id=\"pt-snap\">\n          <button type=\"button\" class=\"snap-sched big-snap\" id=\"card-btn\"><span>📷<\/span>Snap the Medicare or insurance card<small>Sample: Maria Lopez<\/small><\/button>\n          <div class=\"rx-scan hidden\" id=\"card-scan\"><\/div>\n        <\/div>\n        <form id=\"pt-type\" class=\"hidden\">\n          <div class=\"fields\">\n            <label class=\"fld\"><span>Patient name<\/span><input id=\"pt-name\" placeholder=\"Maria Lopez\" autocomplete=\"off\"><\/label>\n            <label class=\"fld\"><span>Date of birth<\/span><input id=\"pt-dob\" placeholder=\"MM/DD/YYYY\" autocomplete=\"off\"><\/label>\n          <\/div>\n          <button class=\"btn btn-soft full-soft\">🔎 Find insurance<\/button>\n        <\/form>\n        <div id=\"ins-out\"><\/div>\n        <a href=\"#\" class=\"fine-link\" id=\"skip-ins\">No card handy? Send anyway, the pharmacy can find it →<\/a>\n      <\/section>\n\n      <!-- 2. Prescription -->\n      <section class=\"rx-step hidden\" id=\"s-rx\">\n        <div class=\"seg rx-how\"><button type=\"button\" data-rx=\"type\" class=\"on\">⌨️ Type<\/button><button type=\"button\" data-rx=\"snap\">📷 Snap a written script<\/button><\/div>\n        <div id=\"rx-snap\" class=\"hidden\">\n          <button type=\"button\" class=\"snap-sched big-snap\" id=\"pad-btn\"><span>📷<\/span>Snap the prescription<small>Sample handwritten script<\/small><\/button>\n          <div class=\"rx-scan hidden\" id=\"pad-scan\"><\/div>\n        <\/div>\n        <div id=\"rx-type\">\n          <label class=\"fld wide\"><span>Medication<\/span><input id=\"med-in\" class=\"med-big\" placeholder=\"Search: ozempic, trulicity, jardiance…\" autocomplete=\"off\"><\/label>\n          <div class=\"med-sug\" id=\"med-sug\"><\/div>\n          <div id=\"med-pick\" class=\"hidden\">\n            <div class=\"rx-lbl\">Dose<\/div><div class=\"chips\" id=\"dose-chips\"><\/div>\n            <div class=\"rx-lbl\">Directions<\/div><div class=\"chips\" id=\"sig-chips\"><\/div>\n            <div class=\"fields rx-qty\">\n              <label class=\"fld\"><span>Quantity<\/span><input id=\"qty-in\"><\/label>\n              <label class=\"fld\"><span>Refills<\/span><input id=\"ref-in\" value=\"5\"><\/label>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <!-- 3. Coverage & same-class options -->\n      <section class=\"rx-step hidden\" id=\"s-cov\"><div id=\"cov-out\"><\/div><\/section>\n\n      <!-- 4. Prior auth packet (only when the plan needs it) -->\n      <section class=\"rx-step hidden\" id=\"s-pa\"><div id=\"pa-out\"><\/div><\/section>\n\n      <!-- 5. Review & send -->\n      <section class=\"rx-step hidden\" id=\"s-send\">\n        <div id=\"rx-summary\"><\/div>\n        <div class=\"rx-lbl\">Pharmacy · patient's choice<\/div>\n        <div class=\"rx-pharm\" id=\"pharm-list\"><\/div>\n        <div class=\"seg rx-how\" id=\"how-seg\"><button type=\"button\" data-how=\"pickup\" class=\"on\">🏪 Pickup<\/button><button type=\"button\" data-how=\"delivery\">🚚 Delivery<\/button><\/div>\n        <button class=\"hidden\" id=\"send-btn\" type=\"button\"><\/button>\n        <div class=\"fine left\">Signed with your two-step sign-in. Controlled substances need EPCS and aren't in this demo.<\/div>\n      <\/section>\n\n      <!-- Done -->\n      <section class=\"hidden\" id=\"s-done\"><\/section>\n\n      <div class=\"flow-cta\" id=\"flow-cta\">\n        <button type=\"button\" class=\"btn btn-big\" id=\"next\">Continue<\/button>\n        <div id=\"swipe\" class=\"hidden\"><\/div>\n      <\/div>\n    <\/div>\n\n    <!-- ACTIVITY: every script, live from the pharmacy -->\n    <div class=\"flow hidden\" id=\"v-activity\">\n      <div class=\"hero\"><div class=\"hero-num\" id=\"act-num\">0<\/div><div class=\"hero-sub\" id=\"act-sub\">scripts in motion<\/div><\/div>\n      <div id=\"sent-list\"><div class=\"muted\">Nothing sent yet.<\/div><\/div>\n      <div class=\"conv hidden\" id=\"conv\">\n        <div class=\"flow-top\"><button type=\"button\" class=\"flow-back\" id=\"conv-back\" aria-label=\"Back\">‹<\/button><div class=\"flow-kicker\" id=\"conv-title\"><\/div><\/div>\n        <div id=\"conv-head\"><\/div>\n        <div class=\"rx-msgs\" id=\"conv-msgs\"><\/div>\n        <div class=\"chips chat-chips\" id=\"conv-chips\"><\/div>\n        <form class=\"chat-form\" id=\"conv-form\"><input id=\"conv-in\" placeholder=\"Message the pharmacy…\" autocomplete=\"off\"><button class=\"btn\">↑<\/button><\/form>\n        <div class=\"fine left\">🔒 Only you and the pharmacy on this script · saved to the chart<\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "// Module 1 · Linkt Rx: the prescriber sends a script (photo or typed), sees coverage and\n// covered same-class options, sends prior auth only if needed, then talks to the pharmacy on the script.\n\nvar pt = null, rx = { key: null, strength: null, sig: null }, how = \"pickup\", pharm = RX_PHARMACIES[0], open = null;\nvar DR = LOGIN.prescriber.name.replace(\"Dr. Anita \", \"Dr. \");\n\n// ---------- 1. Patient & insurance ----------\ndocument.addEventListener(\"click\", function (e) {\n  var b = e.target.closest(\"[data-pt]\");\n  if (b) {\n    document.querySelectorAll(\"[data-pt]\").forEach(function (x) { x.classList.toggle(\"on\", x === b); });\n    $(\"pt-snap\").classList.toggle(\"hidden\", b.dataset.pt !== \"snap\");\n    $(\"pt-type\").classList.toggle(\"hidden\", b.dataset.pt !== \"type\");\n    if (b.dataset.pt === \"type\") $(\"pt-name\").focus();\n  }\n});\n\nasync function findIns(e, fromCard) {\n  var out = $(\"ins-out\");\n  out.innerHTML = '<ul class=\"rules rx-checks\"><li class=\"checking\"><span class=\"rule-ic\"><\/span>Medicare eligibility check' + (fromCard ? \" on MBI \" + e.mbi : \" by name + DOB\") + '…<\/li><\/ul>';\n  await wait(900);\n  out.innerHTML = '<ul class=\"rules rx-checks\"><li class=\"met\"><span class=\"rule-ic\">✓<\/span>Medicare · ' + e.ab + '<div class=\"rule-ev\">Enrolled in ' + e.plan + '<\/div><\/li><li class=\"checking\"><span class=\"rule-ic\"><\/span>Pharmacy benefit (Part D) check…<\/li><\/ul>';\n  await wait(800);\n  pt = e;\n  out.innerHTML = '<div class=\"ins-found\"><div><b>' + e.name + '<\/b> · DOB ' + e.dob + '<\/div><div class=\"big-ins\">' + e.plan + '<\/div>' +\n    '<div class=\"muted\">Member ' + e.member + ' · MBI ' + e.mbi + '<br>' + e.rx + '<\/div><div class=\"verdict\">✓ Insurance found · coverage below is live for this plan<\/div><\/div>';\n  $(\"skip-ins\").classList.add(\"hidden\");\n  logAccess(\"prescriber\", \"Eligibility check for \" + e.name);\n  refresh();\n}\n\n$(\"card-btn\").addEventListener(\"click\", async function () {\n  var e = ELIGIBILITY[\"maria lopez\"];\n  $(\"card-btn\").classList.add(\"hidden\");\n  $(\"card-scan\").classList.remove(\"hidden\");\n  $(\"card-scan\").innerHTML = '<div class=\"scan\">' + medicareCard(e) + '<div class=\"scan-bar\"><\/div><\/div><div class=\"ai-log muted\">Reading the card · photo stays in Linkt and is deleted after reading…<\/div>';\n  await wait(1300);\n  $(\"card-scan\").querySelector(\".scan-bar\").remove();\n  $(\"card-scan\").querySelector(\".ai-log\").innerHTML = '<span class=\"accent\">✨ Read: ' + e.name + ' · MBI ' + e.mbi + ' · photo deleted<\/span>';\n  findIns(e, true);\n});\n\n$(\"pt-type\").addEventListener(\"submit\", function (ev) {\n  ev.preventDefault();\n  var n = $(\"pt-name\").value.trim().toLowerCase() || \"maria lopez\", e = ELIGIBILITY[n];\n  if (!e) {\n    pt = { name: $(\"pt-name\").value.trim(), dob: $(\"pt-dob\").value.trim(), plan: null };\n    $(\"ins-out\").innerHTML = '<div class=\"dc-flags\">No match for that name + DOB. Check the spelling, snap the card, or send anyway and the pharmacy will find it.<\/div>';\n    return refresh();\n  }\n  $(\"pt-name\").value = e.name; $(\"pt-dob\").value = e.dob;\n  findIns(e, false);\n});\n\n$(\"skip-ins\").addEventListener(\"click\", function (ev) {\n  ev.preventDefault();\n  var n = $(\"pt-name\").value.trim();\n  pt = n ? { name: n, dob: $(\"pt-dob\").value.trim() || \"—\", plan: null } : { name: \"Lucy Grant\", dob: \"06/02/1949\", plan: null };\n  $(\"ins-out\").innerHTML = '<div class=\"ins-found\"><b>' + pt.name + '<\/b> · DOB ' + pt.dob + '<div class=\"muted\">No insurance yet · the pharmacy will find it from the Medicare card<\/div><\/div>';\n  refresh();\n});\n\n// ---------- 2. Prescription: typed or photo ----------\ndocument.addEventListener(\"click\", function (e) {\n  var b = e.target.closest(\"[data-rx]\");\n  if (!b) return;\n  document.querySelectorAll(\"[data-rx]\").forEach(function (x) { x.classList.toggle(\"on\", x === b); });\n  $(\"rx-snap\").classList.toggle(\"hidden\", b.dataset.rx !== \"snap\");\n  $(\"rx-type\").classList.toggle(\"hidden\", b.dataset.rx === \"snap\" && !rx.key);\n});\n\nfunction suggest() {\n  var q = $(\"med-in\").value.trim().toLowerCase();\n  var hits = Object.keys(MEDS).filter(function (k) { var m = MEDS[k]; return q && (m.name.toLowerCase().indexOf(q) === 0 || m.generic.indexOf(q) === 0 || MED_CLASS[m.cls].toLowerCase().indexOf(q) !== -1); });\n  $(\"med-sug\").innerHTML = hits.map(function (k) {\n    var m = MEDS[k];\n    return '<button type=\"button\" class=\"med-opt\" data-med=\"' + k + '\"><b>' + m.name + '<\/b> <span class=\"muted\">' + m.generic + ' · ' + m.form + ' · ' + MED_CLASS[m.cls] + '<\/span><\/button>';\n  }).join(\"\");\n}\n$(\"med-in\").addEventListener(\"input\", function () { rx.key = null; $(\"med-pick\").classList.add(\"hidden\"); suggest(); refresh(); });\n\nfunction pickMed(k, strength, sig) {\n  var m = MEDS[k];\n  rx = { key: k, strength: strength || null, sig: sig || m.sigs[0] };\n  $(\"med-in\").value = m.name + \" (\" + m.generic + \")\";\n  $(\"med-sug\").innerHTML = \"\";\n  $(\"med-pick\").classList.remove(\"hidden\");\n  $(\"rx-type\").classList.remove(\"hidden\");\n  $(\"dose-chips\").innerHTML = Object.keys(m.strengths).map(function (s) { return '<button type=\"button\" class=\"chip' + (s === rx.strength ? \" on\" : \"\") + '\" data-dose=\"' + s + '\">' + s + '<\/button>'; }).join(\"\");\n  $(\"sig-chips\").innerHTML = m.sigs.concat([\"Use as directed\"]).map(function (s) { return '<button type=\"button\" class=\"chip' + (s === rx.sig ? \" on\" : \"\") + '\" data-sig=\"' + s + '\">' + s + '<\/button>'; }).join(\"\");\n  $(\"qty-in\").value = m.qty;\n  refresh();\n}\n\ndocument.addEventListener(\"click\", function (e) {\n  var m = e.target.closest(\"[data-med]\"), d = e.target.closest(\"[data-dose]\"), s = e.target.closest(\"[data-sig]\");\n  if (m) pickMed(m.dataset.med);\n  if (d) { rx.strength = d.dataset.dose; document.querySelectorAll(\"[data-dose]\ idden dv\" id=\"dv-pts\">\n    <div class=\"ord-head\"><div><div class=\"big-line\">Patients<\/div><div class=\"muted\">Riverside Family Medicine · Dr. Anita Shah's panel<\/div><\/div><\/div>\n    <div class=\"card pad\"><div id=\"pts-list\"><\/div><\/div>\n  <\/main>\n\n  <!-- Prior auths -->\n  <main class=\"page hidden dv\" id=\"dv-pa\">\n    <div class=\"ord-head\"><div><div class=\"big-line\">Prior auths<\/div><div class=\"muted\" id=\"pa-sub\"><\/div><\/div><\/div>\n    <div class=\"card pad\"><div class=\"card-title\">In progress<\/div><div id=\"pa-list\"><\/div><\/div>\n    <div class=\"card pad dv-gap\"><div class=\"card-title\">Expiring soon<\/div><div id=\"pa-renew\"><\/div><\/div>\n  <\/main>\n\n  <!-- Messages -->\n  <main class=\"page hidden dv\" id=\"dv-msg\">\n    <div class=\"ord-head\"><div><div class=\"big-line\">Messages<\/div><div class=\"muted\">Care team, pharmacies and health plans, in one secure place<\/div><\/div><\/div>\n    <div class=\"card pad\"><div id=\"msg-list\"><\/div><\/div>\n  <\/main>\n\n  <main class=\"page dv\" id=\"dv-rx\">\n    <!-- Prior auths about to expire: renew before the patient runs out -->\n    <div class=\"card renew\" id=\"renew\">\n      <div class=\"renew-head\"><b>⏰ Prior auths expiring soon<\/b><span class=\"muted\">We remind you 30 days ahead, so patients never run out.<\/span><\/div>\n      <div id=\"renew-rows\"><\/div>\n      <input type=\"file\" id=\"renew-input\" accept=\"image/*,.pdf\" multiple hidden>\n    <\/div>\n\n    <div class=\"two-col\">\n      <div class=\"stack\">\n        <!-- 1. Patient: photo of the facesheet fills the chart -->\n        <div class=\"card pad\">\n          <div class=\"card-title\">1 · Patient<\/div>\n          <div id=\"pt-capture\">\n            <label class=\"drop\">\n              <input type=\"file\" id=\"face-input\" accept=\"image/*\" capture=\"environment\" hidden>\n              <span class=\"drop-ic\">📷<\/span>\n              <span><b>Take a photo of the facesheet =\"card-title\">2 · New prescription<\/div>\n          <label class=\"field-label\">Medication<\/label>\n          <form id=\"drug-form\" class=\"drug-form\">\n            <input id=\"drug-input\" type=\"text\" placeholder=\"Type any medication…\" autocomplete=\"off\">\n            <button type=\"submit\" class=\"btn\">Add<\/button>\n          <\/form>\n          <div class=\"chips\" id=\"chips\"><\/div>\n          <div class=\"rx-line hidden\" id=\"rx-line\">\n            <div><span class=\"muted\">Dose<\/span><b id=\"rx-dose\"><\/b><\/div>\n            <div><span class=\"muted\">Send to<\/span><b id=\"rx-pharm\"><\/b><\/div>\n            <div><span class=\"muted\">Updates to patient<\/span><b id=\"rx-text\">📱 Text · consented<\/b><\/div>\n          <\/div>\n        <\/div>\n\n        <!-- 3. Records: photos or files, AI pulls out the values -->\n        <div class=\"card pad\">\n          <div class=\"card-title\">3 · Supporting records<\/div>\n          <label class=\"drop\" id=\"drop\">\n            <input type=\"file\" id=\"file-input\" accept=\"image/*,.pdf\" multiple hidden>\n            <span class=\"drop-ic\">📄<\/span>\n            <span><b>Snap or drop labs, notes, med lists<\/b><br><span class=\"muted\">AI reads values like A1c for you<\/span><\/span>\n          <\/label>\n          <div class=\"link-row\">\n            <button class=\"link-btn\" id=\"sample-btn\" type=\"button\">Use sample records<\/button>\n            <button class=\"link-btn\" id=\"type-btn\" type=\"button\">+ Type a value<\/button>\n          <\/div>\n          <form class=\"type-val hidden\" id=\"type-form\">\n            <input id=\"tv-name\" placeholder=\"e.g. A1c\" autocomplete=\"off\">\n            <input id=\"tv-val\" placeholder=\"e.g. 8.1%\" autocomplete=\"off\">\n            <button class=\"btn\">Add<\/button>\n          <\/form>\n          <ul class=\"files\" id=\"files\"><\/ul>\n        <\/div>\n      <\/div>\n\n      <div class=\"card pad req\">\n        <div class=\"empty\" id=\"req-empty\">\n          <div class=\"empty-ic\">🛡️<\/div>\n          <div>Add a patient and a medication to see what their plan needs to approve it.<\/div>\n        <\/div>\n\n        <div class=\"hidden\" id=\"req-body\">\n          <div class=\"card-title\" id=\"req-title\"><\/div>\n          <div class=\"req-head\" id=\"req-head\"><\/div>\n          <ul class=\"rules\" id=\"rules\"><\/ul>\n          <div class=\"ai-log muted\" id=\"ai-log\"><\/div>\n          <button class=\"btn btn-big full\" id=\"check-btn\" disabled><\/button>\n\n          <div class=\"sign hidden\" id=\"sign\">\n            <div class=\"verdict\" id=\"doc-verdict\"><\/div>\n            <div class=\"card-title send-title\">Send to Aetna by<\/div>\n            <div class=\"methods\" id=\"methods\"><\/div>\n            <div class=\"sig-box\"><span class=\"sig\" id=\"sig\"><\/span><span class=\"sig-line\">Dr. Anita Shah · I confirm this medication is medically necessary.<\/span><\/div>\n            <button class=\"btn btn-big full\" id=\"sign-btn\">Dr. Shah: e-sign &amp; send<\/button>\n            <div class=\"sent hidden\" id=\"sent\">\n              <div><b class=\"accent\">41 sec<\/b> <span class=\"muted\">of staff time · usually 18 min<\/span><\/div>\n              <div class=\"card-title\">Where's the script?<\/div>\n              <ol class=\"track\" id=\"track\"><\/ol>\n              <a class=\"btn\" id=\"to-payer\" target=\"linkt_insurer\">Sent to Aetna ↗<\/a>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n\n  <!-- AI phone call to the plan -->\n  <div class=\"modal hidden\" id=\"call\">\n    <div class=\"modal-card\">\n      <div class=\"call-head\"><span class=\"call-dot\"><\/span><b id=\"call-title\">Calling Aetna PA line<\/b><span class=\"muted\" id=\"call-time\">0:00<\/span><\/div>\n      <div class=\"call-log\" id=\"call-log\"><\/div>\n      <div class=\"fine left\">The AI says it's an automated assistant and that the call is recorded. If Aetna asks for a peer-to-peer review, Dr. Shah takes that call herself.<\/div>\n      <button class=\"btn full hidden\" id=\"call-done\">Done · save to chart<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- Ask Linkt AI -->\n  <div class=\"chat\" id=\"chat\">\n    <button class=\"chat-toggle\" id=\"chat-toggle\">💬 Ask Linkt AI<\/button>\n    <div class=\"chat-panel\">\n      <div class=\"chat-head\"><b>Linkt AI<\/b><span class=\"muted\"> · ask about this prior auth<\/span><button class=\"chat-x\" id=\"chat-x\">×<\/button><\/div>\n      <div class=\"chat-msgs\" id=\"chat-msgs\"><\/div>\n      <div class=\"chips chat-chips\" id=\"q-chips\"><\/div>\n      <form class=\"chat-form\" id=\"chat-form\"><input id=\"chat-input\" placeholder=\"Ask a question…\" autocomplete=\"off\"><button class=\"btn\">↑<\/button><\/form>\n    <\/div>\n  <\/div>\n\n  <!-- Renew: upload or use the sample -->\n  <div class=\"modal hidden\" id=\"renew-pick\">\n    <div class=\"modal-card\">\n      <button class=\"chat-x\" id=\"renew-x\" type=\"button\">×<\/button>\n      <div class=\"card-title\" id=\"renew-title\"><\/div>\n      <div class=\"muted\" id=\"renew-need\"><\/div>\n      <button class=\"btn full\" id=\"renew-upload\" type=\"button\">📷 Snap or upload the record<\/button>\n      <button class=\"btn btn-soft full\" id=\"renew-sample\" type=\"button\">Use the sample record<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\"><\/div>\n  \n  \n  \n", "js": "// Prescriber portal: MA snaps the facesheet (AI fills the chart), patient consents on a tablet,\n// records are read for values like A1c, AI checks the plan's rules, the doctor e-signs and\n// it goes to the plan by ePA, auto-fax, print or an AI phone call. Expiring PAs get renewed here.\n\nvar drug = null, files = [], checked = false, ptReady = false, method = \"epa\", consentSigned = false;\n\n// ---------- 1. Patient: facesheet photo → chart ----------\nfunction sampleSheet() {\n  return '<div class=\"sheet\"><div class=\"sheet-hd\"><b>RIVERSIDE FAMILY MEDICINE<\/b><span>PATIENT FACESHEET<\/span><\/div>' +\n    FACESHEET.map(function (f) { return '<div><span>' + f[1] + '<\/span>' + f[2] + '<\/div>'; }).join(\"\") + '<\/div>';\n}\n\nasync function scan(imgUrl) {\n  $(\"pt-capture\").classList.add(\"hidden\");\n  $(\"pt-scan\").classList.remove(\"hidden\");\n  $(\"scan-img\").innerHTML = imgUrl ? '<img src=\"' + imgUrl + '\" alt=\"Facesheet photo\">' : sampleSheet();\n  var log = $(\"scan-log\");\n  log.textContent = \"Reading the facesheet…\";\n  await wait(1200);\n  log.textContent = \"Found \" + FACESHEET.length + \" fields · matching to the chart…\";\n  await wait(700);\n  showForm(true);\n  var inputs = document.querySelectorAll(\"#pt-fields input\");\n  for (var i = 0; i < FACESHEET.length; i++) {\n    inputs[i].value = FACESHEET[i][2];\n    inputs[i].parentNode.classList.add(\"filled\");\n    syncPatient();\n    await wait(110);\n  }\n  log.innerHTML = \"✨ Filled \" + FACESHEET.length + \" of \" + FACESHEET.length + \" fields from one photo · please check, then tap a field to fix it\";\n  $(\"pt-scan\").classList.add(\"hidden\");\n  logAccess(\"doctor\", \"Scanned facesheet · created chart for \" + PATIENT.name);\n  logAccess(\"doctor\", \"📸 Facesheet photo stored encrypted in the chart · not on the camera roll\");\n  if (imgUrl) URL.revokeObjectURL(imgUrl);   // drop the phone's temporary copy\n  $(\"scan-log\").insertAdjacentHTML(\"beforeend\", '<div class=\"media-chip\">🔒 Photo stored encrypted in the chart, not in the phone\\'s photos<\/div>');\n}\n\nfunction showForm() {\n  $(\"pt-capture\").classList.add(\"hidden\");\n  $(\"pt-form\").classList.remove(\"hidden\");\n  $(\"pt-fields\").innerHTML = FACESHEET.map(function (f) {\n    var wide = /address|problems|meds|contact/.test(f[0]) ? \" wide\" : \"\";\n    return '<label class=\"fld' + wide + '\"><span>' + f[1] + '<\/span><input data-k=\"' + f[0] + '\" autocomplete=\"off\"><\/label>';\n  }).join(\"\");\n  $(\"pt-fields\").addEventListener(\"input\", syncPatient);\n}\n\nfunction val(k) { var el = document.querySelector('#pt-fields [data-k=\"' + k + '\"]'); return el ? el.value.trim() : \"\"; }\n\nfunction syncPatient() {\n  var name = val(\"name\");\n  if (name) {\n    PATIENT.name = name;\n    PATIENT.first = name.split(\" \")[0];\n  }\n  if (val(\"dob\")) PATIENT.dob = val(\"dob\");\n  if (val(\"phone\")) PATIENT.phone = val(\"phone\");\n  if (val(\"plan\")) PATIENT.plan = val(\"plan\");\n  if (val(\"memberId\")) PATIENT.memberId = val(\"memberId\");\n  $(\"pt-av\").textContent = name ? name.split(\" \").map(function (w) { return w[0]; }).join(\"\").slice(0, 2).toUpperCase() : \"?\";\n  $(\"pt-name\").textContent = name || \"New patient\";\n  $(\"pt-meta\").textContent = [val(\"dob\") && \"DOB \" + val(\"dob\"), val(\"plan\")].filter(Boolean).join(\" · \");\n  $(\"c-sign\").textContent = \"✍️ \" + (PATIENT.first || \"Patient\") + \" signs on tablet\";\n  ptReady = !!(name && val(\"plan\"));\n  refreshCheck();\n}\n\n$(\"face-input\").addEventListener(\"change\", function (e) {\n  if (e.target.files[0]) scan(URL.createObjectURL(e.target.files[0]));\n});\n$(\"face-sample\").addEventListener(\"click\", function () { scan(null); });\n$(\"face-type\").addEventListener(\"click\", function () {\n  showForm();\n  syncPatient();\n  document.querySelector(\"#pt-fields input\").focus();\n});\n\n// Consent: text updates need opt-in (TCPA). Sharing for treatment/payment doesn't (HIPAA).\n$(\"c-sign\").addEventListener(\"click\", function () {\n  consentSigned = true;\n  $(\"c-sign\").classList.add(\"hidden\");\n  $(\"c-done\").classList.remove(\"hidden\");\n  $(\"c-done\").innerHTML = '<span class=\"sig small draw\">' + PATIENT.name + '<\/span><div class=\"muted\">✓ Signed on tablet · ' + clock() + ' · saved to chart<\/div>';\n  logAccess(\"doctor\", \"Recorded consent · texts \" + ($(\"c-text\").checked ? \"ON\" : \"OFF\") + \" · privacy notice given\");\n});\n$(\"c-text\").addEventListener(\"change\", function () {\n  $(\"rx-text\").textContent = $(\"c-text\").checked ? \"📱 Text · consented\" : \"🚫 No texts · patient declined\";\n});\n\n// ---------- 2. Prescription ----------\nfunction setDrug(text) {\n  if (checked) return;\n  if (!text.trim()) { toast(\"Type a medication, or tap one of the suggestions below\"); $(\"drug-input\").focus(); return; }\n  if (!ptReady) { toast(\"📷 Add the patient first: snap the facesheet\"); return; }\n  drug = findDrug(text);\n  $(\"drug-input\").value = drug.brand;\n  $(\"rx-line\").classList.remove(\"hidden\");\n  $(\"rx-dose\").textContent = drug.generic;\n  $(\"rx-pharm\").textContent = PHARMACY.name;\n\n  $(\"req-empty\").classList.add(\"hidden\");\n  $(\"req-body\").classList.remove(\"hidden\");\n  $(\"req-title\").textContent = PATIENT.plan + \" requires\";\n  $(\"req-head\").innerHTML = \"Prior auth for <b>\" + drug.brand + \"<\/b> · \" + drug.criteria.length + \" rules\";\n  $(\"rules\").innerHTML = drug.criteria.map(function (c) {\n    return '<li><span class=\"rule-ic\">?<\/span><span class=\"rule-txt\">' + c[0] + '<\/span><span class=\"rule-ev\"><\/span><\/li>';\n  }).join(\"\");\n  $(\"ai-log\").textContent = \"\";\n  refreshCheck();\n}\n\n$(\"drug-form\").addEventListener(\"submit\", function (e) { e.preventDefault(); setDrug($(\"drug-input\").value); });\n$(\"chips\").innerHTML = SUGGESTIONS.map(function (s) { return '<button class=\"chip\" type=\"button\">' + s + '<\/button>'; }).join(\"\");\n$(\"chips\").addEventListener(\"click\", function (e) {\n  if (e.target.classList.contains(\"chip\")) setDrug(e.target.textContent);\n});\n\n// ---------- 3. Records: photos or files; AI pulls out the values ----------\nasync function addFiles(names) {\n  for (var i = 0; i < names.length; i++) {\n    if (files.indexOf(names[i]) !== -1) continue;\n    files.push(names[i]);\n    var li = document.createElement(\"li\");\n    var ic = /\\.(jpe?g|png|heic|webp)$/i.test(names[i]) ? \"📷\" : \"📄\";\n    li.innerHTML = '<span class=\"file-ic\">' + ic + '<\/span><span class=\"file-name\">' + names[i] + '<\/span><span class=\"file-st\"><span class=\"spin\"><\/span>Reading…<\/span>';\n    $(\"files\").appendChild(li);\n    await wait(600);\n    var vals = EXTRACT[names[i]] || EXTRACT_POOL[(files.length - 1) % EXTRACT_POOL.length];\n    li.querySelector(\".file-st\").innerHTML = \"✓ \" + vals.length + \" values found\";\n    li.classList.add(\"read\");\n    li.insertAdjacentHTML(\"beforeend\", '<div class=\"vals\">' + vals.map(function (v) { return \"<span>\" + v + \"<\/span>\"; }).join(\"\") + '<\/div>');\n  }\n  if (names.length) logAccess(\"doctor\", \"📸 Stored \" + names.length + \" record image\" + (names.length > 1 ? \"s\" : \"\") + \" encrypted in the chart\");\n  if (names.length) logAccess(\"doctor\", \"Uploaded \" + names.length + \" record\" + (names.length > 1 ? \"s\" : \"\") + \" to \" + PATIENT.name + \"'s chart\");\n  refreshCheck();\n}\n\n$(\"file-input\").addEventListener(\"change\", function (e) {\n  addFiles(Array.prototype.map.call(e.target.files, function (f) { return f.name; }));\n});\n[\"dragenter\", \"dragover\"].forEach(function (ev) {\n  $(\"drop\").addEventListener(ev, function (e) { e.preventDefault(); $(\"drop\").classList.add(\"over\"); });\n});\n[\"dragleave\", \"drop\"].forEach(function (ev) {\n  $(\"drop\").addEventListener(ev, function (e) { e.preventDefault(); $(\"drop\").classList.remove(\"over\"); });\n});\n$(\"drop\").addEventListener(\"drop\", function (e) {\n  addFiles(Array.prototype.map.call(e.dataTransfer.files, function (f) { return f.name; }));\n});\n$(\"sample-btn\").addEventListener(\"click\", function () { addFiles(SAMPLE_FILES); });\n\n// Or type a value by hand (e.g. A1c 8.1%)\n$(\"type-btn\").addEventListener(\"click\", function () { $(\"type-form\").classList.toggle(\"hidden\"); $(\"tv-name\").focus(); });\n$(\"type-form\").addEventListener(\"submit\", function (e) {\n  e.preventDefault();\n  var n = $(\"tv-name\").value.trim(), v = $(\"tv-val\").value.trim();\n  if (!n || !v) return;\n  files.push(\"Typed: \" + n);\n  $(\"files\").insertAdjacentHTML(\"beforeend\", '<li class=\"read\"><span class=\"file-ic\">⌨️<\/span><span class=\"file-name\">Typed by staff<\/span><span class=\"file-st\">✓ added<\/span><div class=\"vals\"><span>' + n + \" \" + v + '<\/span><\/div><\/li>');\n  $(\"tv-name\").value = \"\"; $(\"tv-val\").value = \"\";\n  refreshCheck();\n});\n\nfunction refreshCheck() {\n  var ready = ptReady && drug && files.length && !checked;\n  $(\"check-btn\").disabled = !ready;\n  $(\"check-btn\").textContent = !ptReady ? \"Add the patient first (step 1)\" : !drug ? \"Pick a medication (step 2)\" : !files.length ? \"Add records to check (step 3)\" : \"✨ Check records with AI\";\n}\n\n// ---------- AI check ----------\n$(\"check-btn\").addEventListener(\"click\", async function () {\n  checked = true;\n  $(\"check-btn\").classList.add(\"hidden\");\n  $(\"drug-input\").disabled = true;\n  var log = $(\"ai-log\"), items = $(\"rules\").children;\n\n  log.textContent = \"Reading \" + files.length + \" record\" + (files.length > 1 ? \"s\" : \"\") + \" + \" + PATIENT.first + \"'s chart…\";\n  await wait(1000);\n  for (var i = 0; i < items.length; i++) {\n    items[i].classList.add(\"checking\");\n    log.textContent = \"Looking for: \" + drug.criteria[i][0] + \"…\";\n    await wait(900);\n    items[i].classList.remove(\"checking\");\n    items[i].classList.add(\"met\");\n    items[i].querySelector(\".rule-ic\").textContent = \"✓\";\n    items[i].querySelector(\".rule-ev\").innerHTML = drug.criteria[i][1] + ' <span class=\"src\">· ' + files[i % files.length] + '<\/span>';\n  }\n  log.textContent = \"Pre-filled \" + PAYER.name + \"'s prior auth form · 24 of 24 fields · proof pages attached\";\n  await wait(600);\n  $(\"doc-verdict\").innerHTML = \"✓ Meets <b>\" + items.length + \" of \" + items.length + \"<\/b> of \" + PAYER.name + \"'s rules\";\n  renderMethods();\n  $(\"sign\").classList.remove(\"hidden\");\n});\n\n// ---------- How it goes to the plan ----------\nfunction renderMethods() {\n  $(\"methods\").innerHTML = Object.keys(METHODS).map(function (k) {\n    var m = METHODS[k];\n    return '<button type=\"button\" class=\"method' + (k === method ? \" on\" : \"\") + '\" data-m=\"' + k + '\"><b>' + m.ic + \" \" + m.name + '<\/b><span>' + m.sub + '<\/span><\/button>';\n  }).join(\"\");\n}\n$(\"methods\").addEventListener(\"click\", function (e) {\n  var b = e.target.closest(\"[data-m]\");\n  if (!b) return;\n  method = b.dataset.m;\n  renderMethods();\n});\n\n// Printable, already-filled PA form with a fax cover sheet\nfunction printForm() {\n  var w = window.open(\"\", \"_blank\");\n  if (!w) { toast(\"Allow pop-ups to print the form\"); return; }\n  var rows = drug.criteria.map(function (c, i) { return \"<tr><td>\" + c[0] + \"<\/td><td>\" + c[1] + \"<\/td><td>\" + files[i % files.length] + \"<\/td><\/tr>\"; }).join(\"\");\n  w.document.write('<html><head><title>PA form · ' + PATIENT.name + '<\/title><style>body{font:15px Arial;margin:40px;color:#111}h1{font-size:22px}h2{font-size:17px;margin-top:28px;border-bottom:2px solid #111}td,th{border:1px solid #999;padding:6px 8px;text-align:left}table{border-collapse:collapse;width:100%}.cover{border:3px solid #111;padding:18px;margin-bottom:30px}<\/style><\/head><body>' +\n    '<div class=\"cover\"><h1>FAX COVER · CONFIDENTIAL<\/h1>To: ' + PAYER.name + ' Pharmacy Prior Authorization · Fax ' + PAYER.paFax + '<br>From: ' + DOCTOR.name + ', ' + DOCTOR.clinic + ' · NPI ' + DOCTOR.npi + '<br>Pages: 1 + ' + files.length + ' attachments<br><small>Contains protected health information. If received in error, notify sender and destroy.<\/small><\/div>' +\n    '<h1>Prior Authorization Request · ' + PAYER.plan + '<\/h1>' +\n    '<h2>Patient<\/h2>' + PATIENT.name + ' · DOB ' + PATIENT.dob + ' · Member ' + PATIENT.memberId + ' · Phone ' + PATIENT.phone +\n    '<h2>Medication<\/h2>' + drug.brand + ' (' + drug.generic + ') · 30-day supply · Pharmacy: ' + PHARMACY.name +\n    '<h2>Criteria and evidence<\/h2><table><tr><th>Plan requires<\/th><th>Evidence<\/th><th>Source<\/th><\/tr>' + rows + '<\/table>' +\n    '<h2>Prescriber attestation<\/h2>I confirm this medication is medically necessary.<br><br>Signed electronically: ' + DOCTOR.name + ' · ' + new Date().toLocaleString() +\n    '<\/body><\/html>');\n  w.document.close();\n  w.focus();\n  setTimeout(function () { w.print(); }, 300);\n}\n\n// AI calls the plan's PA line on the clinic's behalf (says it's automated)\nasync function aiCall() {\n  $(\"call\").classList.remove(\"hidden\");\n  $(\"call-done\").classList.add(\"hidden\");\n  $(\"call-log\").innerHTML = \"\";\n  var start = Date.now(), timer = setInterval(function () {\n    var s = Math.floor((Date.now() - start) / 1000) * 6;\n    $(\"call-time\").textContent = Math.floor(s / 60) + \":\" + (\"0\" + s % 60).slice(-2);\n  }, 1000);\n  var lines = [\n    [\"sys\", \"📞 Dialing \" + PAYER.name + \" provider PA line \" + PAYER.paPhone + \"…\"],\n    [\"them\", \"<b>Phone menu:<\/b> For pharmacy prior authorization, press 2.\"],\n    [\"sys\", \"🤖 Pressed 2 · entered NPI \" + DOCTOR.npi],\n    [\"them\", \"<b>Aetna (Dana):<\/b> Pharmacy PA, this is Dana. How can I help?\"],\n    [\"ai\", \"<b>Linkt AI:<\/b> Hi Dana, I'm Linkt, an automated assistant calling for \" + DOCTOR.name + \"'s office. This call is recorded. I'm requesting prior auth for \" + drug.brand + \" \" + strength(drug) + \" for member \" + PATIENT.memberId + \".\"],\n    [\"them\", \"<b>Dana:<\/b> Sure. Can you confirm the date of birth?\"],\n    [\"ai\", \"<b>Linkt AI:<\/b> \" + PATIENT.dob + \".\"],\n    [\"them\", \"<b>Dana:<\/b> Got it. I'll need the clinicals.\"],\n    [\"ai\", \"<b>Linkt AI:<\/b> Sending \" + files.length + \" documents to your PA fax now. All \" + drug.criteria.length + \" criteria are met. May I have a reference number?\"],\n    [\"them\", \"<b>Dana:<\/b> Reference PA-REF-55812. You'll have a decision within 72 hours, usually today.\"],\n    [\"sys\", \"✓ Call ended · reference saved to the chart · transcript attached\"]\n  ];\n  for (var i = 0; i < lines.length; i++) {\n    await wait(i ? 900 : 400);\n    $(\"call-log\").insertAdjacentHTML(\"beforeend\", '<div class=\"cl ' + lines[i][0] + '\">' + lines[i][1] + '<\/div>');\n    $(\"call-log\").scrollTop = 99999;\n  }\n  clearInterval(timer);\n  $(\"call-title\").textContent = \"Call complete\";\n  $(\"call-done\").classList.remove(\"hidden\");\n  return new Promise(function (r) { $(\"call-done\").onclick = function () { $(\"call\").classList.add(\"hidden\"); r(); }; });\n}\n\n// ---------- E-sign & send ----------\n$(\"sign-btn\").addEventListener(\"click\", async function () {\n  if (method === \"print\") printForm();   // must open in the click, before any waiting\n  $(\"sign-btn\").classList.add(\"hidden\");\n  $(\"methods\").classList.add(\"locked\");\n  $(\"sig\").textContent = DOCTOR.name.replace(\"Dr. \", \"\");\n  $(\"sig\").classList.add(\"draw\");\n  await wait(1100);\n\n  var log = $(\"ai-log\");\n  if (method === \"fax\") {\n    log.textContent = \"📠 Faxing cover + form + \" + files.length + \" records to \" + PAYER.name + \" \" + PAYER.paFax + \"…\";\n    await wait(1600);\n    log.textContent = \"✓ Fax delivered · \" + (files.length + 2) + \" pages · confirmation saved\";\n  } else if (method === \"print\") {\n    log.textContent = \"🖨️ Printed. Fax it to \" + PAYER.name + \" at \" + PAYER.paFax + \". We'll track the answer here.\";\n  } else if (method === \"call\") {\n    await aiCall();\n    log.textContent = \"📞 Requested by phone · ref PA-REF-55812\";\n  } else {\n    log.textContent = \"⚡ Sent electronically to \" + PAYER.name;\n  }\n\n  var textOK = $(\"c-text\").checked;\n  var state = {\n    drugText: drug.brand, files: files, status: \"sent\", thread: [], texts: [], method: method, textConsent: textOK,\n    patient: { name: PATIENT.name, first: PATIENT.first, dob: PATIE nt and a medication first and I'll pull their plan's rules.\";\n  var d = drug, p = PATIENT.plan;\n  if (/why|need|require|prior/.test(t))\n    return p + \" requires prior auth for \" + d.brand + \" because it's a high-cost drug. They only need proof of the \" + d.criteria.length + \" rules on the right, and I can match each one to \" + PATIENT.first + \"'s records.\";\n  if (/not met|isn.t|fail|missing|deny|denied|below|under/.test(t))\n    return \"I'd flag that rule in grey <b>before<\/b> you sign and tell you exactly what's missing, like a recent lab. You never send a request that gets denied.\";\n  if (/alternative|cheaper|covered|instead|formulary|generic/.test(t))\n    return p + \" covers <b>\" + d.alt + \"<\/b> with no prior auth. But \" + d.brand + \" meets every rule, so approval is expected. No need to switch.\";\n  if (/expire|renew/.test(t))\n    return \"Approvals usually last 6 to 12 months. I remind you 30 days before, and renewing takes one new upload, like a recent lab.\";\n  if (/fast|long|time|when|quick|soon/.test(t))\n    return \"By ePA, \" + p + \" can approve in <b>minutes<\/b>. By fax or phone it's up to 72 hours. \" + PHARMACY.name + \" is notified the moment it's approved.\";\n  if (/copay|cost|price|pay/.test(t))\n    return \"Once approved, \" + PATIENT.first + \"'s copay is <b>$\" + PATIENT.copay + \"<\/b> for 30 days. Without approval the cash price is about \" + money(d.value) + \".\";\n  if (/upload|file|record|document|lab|photo/.test(t))\n    return \"Snap a photo or drop any lab report, visit note or med list. I read values like A1c and attach only the pages that prove each rule.\";\n  return \"I checked \" + p + \"'s policy for \" + d.brand + \": all you need are the \" + d.criteria.length + \" rules on the right. Upload any missing record and I'll match it automatically.\";\n}\n\nfunction addMsg(html, who) {\n  var m = document.createElement(\"div\");\n  m.className = \"msg \" + who;\n  m.innerHTML = html;\n  $(\"chat-msgs\") ass=\"muted\">No prior auths in progress. Start one from Prescriptions.<\/div><button type=\"button\" class=\"btn small-btn\" data-dvgo=\"rx\" style=\"margin-top:10px\">New prescription<\/button>';\n  $(\"pa-renew\").innerHTML = RENEWALS.map(function (r, i) {\n    return '<div class=\"act-row\"><div class=\"act-ic\">⏰<\/div><div><b>' + r.patient + '<\/b><span class=\"muted\">' + r.drug + ' · ' + r.plan + ' · expires ' + addDays(r.days) + '<\/span><\/div><div class=\"act-st\">' +\n      (r.done ? '<span class=\"pos\">Renewal sent ✓<\/span>' : r.busy ? '<small>' + r.busy + '<\/small>' : '<button type=\"button\" class=\"btn small-btn\" data-renew=\"' + i + '\">Renew<\/button>') + '<\/div><\/div>';\n  }).join(\"\");\n  var open = RENEWALS.filter(function (r) { return !r.done; }).length;\n  $(\"pa-sub\").textContent = cur.length + \" in progress · \" + open + \" expiring soon\";\n  $(\"pa-dot\").classList.toggle(\"hidden\", !open);\n  var thread = (st && st.thread) || [];\n  var lastT = thread.filter(function (m) { return m.from !== \"system\"; }).pop();\n  var rows = ['<div class=\"act-row\" data-open-thread><div class=\"act-ic\">🔒<\/div><div><b>Care team · ' + ((st && st.patient && st.patient.name) || PATIENT.name) + '<\/b><span class=\"muted\">' + (lastT ? PARTY[lastT.from].org + \": \" + lastT.text : thread.length ? \"Updates from the plan and pharmacy\" : \"Opens when you send a prescription\") + '<\/span><\/div><div class=\"act-st\"><button type=\"button\" class=\"btn small-btn btn-soft\" data-open-thread>Open<\/button><\/div><\/div>'];\n  rxs.forEach(function (r) {\n    var ms = (r.daycare ? (r.mdMsgs || []) : r.msgs).filter(function (m) { return m.from !== \"system\"; }), lm = ms[ms.length - 1];\n    if (lm) rows.push('<div class=\"act-row\"><div class=\"act-ic\">💊<\/div><div><b>' + r.pharmacy.split(\" · \")[0] + ' · ' + r.patient.name + '<\/b><span class=\"muted\">' + lm.text + '<\/span><\/div><div class=\"act-st\"><a class=\"btn small-btn btn-soft\" href=\"prescribe.html\">Reply in Linkt Rx<\/a><\/div><\/div>');\n  });\n  $(\"msg-list\").innerHTML = rows.join(\"\");\n}\ndocument.addEventListener(\"click\", function (e) {\n  var d = e.target.closest(\"[data-dv]\"), g = e.target.closest(\"[data-dvgo]\"), pg = e.target.closest(\"[data-ptgo]\"), th = e.target.closest(\"[data-open-thread]\");\n  if (d) return dview(d.dataset.dv);\n  if (g) return dview(g.dataset.dvgo);\n  if (pg) {\n    var p = CLINIC_PTS[+pg.dataset.ptgo];\n    if (p.current) return dview(\"rx\");\n    logAccess(\"doctor\", \"Opened chart · \" + p.name);\n    return toast(\"📂 \" + p.name + \"'s chart · \" + p.note + \". In this demo, new prescriptions use Maria Lopez.\");\n  }\n  if (th) { var t = $(\"thread-toggle\"); if (t) t.click(); }\n});\ndocument.querySelectorAll(\"#dv-pa\").forEach(function (el) { el.addEventListener(\"click\", function (e) { var b = e.target.closest(\"[data-renew]\"); if (!b) return; renewing = +b.dataset.renew; var r = RENEWALS[renewing]; $(\"renew-title\").textContent = \"Renew \" + r.drug + \" · \" + r.patient; $(\"renew-need\").textContent = r.plan + \" needs \" + r.need + \". Snap it or upload the file, and AI checks the renewal rules.\"; $(\"renew-pick\").classList.remove(\"hidden\"); }); });\nonStateChange(function () { renderDocViews(); });\nonRxChange(function () { renderDocViews(); });\n\n// ---------- Start ----------\n$(\"who\").textContent = LOGIN.doctor.name + \" · for \" + DOCTOR.name;\naddMsg(\"Hi Jasmine, I can explain the plan's rules, check what's missing, or find a covered alternative.\", \"ai\");\nrenderRenewals();\nrefreshCheck();\nrenderDocViews();\ninitThread(\"doctor\");\nportalLogin(\"doctor\");\n"}, "pharmacy": {"label": "CarePak Pharmacy", "ic": "💊", "phone": false, "cls": "", "title": "Linkt for Pharmacies", "body": "\n\n  <header class=\"topbar\">\n    <div class=\"brand\"><span class=\"logo\"><\/span> Linkt <span class=\"role-tag\" id=\"role-tag\">for Pharmacies<\/span><\/div>\n    <nav class=\"nav hidd trength(d) { return d.generic.replace(/^\\S+\\s?/, \"\"); }\n\n// ---------- Shared demo state ----------\n// The scanned patient and the prescriber (clinic doctor or visiting NP) become what every site shows\nfunction applyPeople(s) {\n  if (!s) return;\n  if (s.patient) Object.assign(PATIENT, s.patient);\n  if (s.prescriber) {\n    Object.assign(DOCTOR, s.prescriber);\n    PARTY.doctor.name = s.prescriber.name;\n    PARTY.doctor.org = s.prescriber.clinic;\n    PARTY.doctor.ic = \"🏠\";\n  }\n  if (s.pharmacy) {\n    PHARMACY.name = PARTY.pharmacy.org = s.pharmacy.name;\n    PHARMACY.address = s.pharmacy.addr;\n  }\n}\n\n// The clinic's scan of the facesheet becomes the patient everyone sees\nfunction readStore() {\n  try {\n    var s = JSON.parse(localStorage.getItem(STORE_KEY));\n    applyPeople(s);\n    return s;\n  } catch (e) { return null; }\n}\n\nfunction loadState() {\n  var s = readStore(), m = location.hash.match(/s=([^&]+)/);\n  if (m) {\n    try {\n      var h = JSON.parse(decodeURIComponent(m[1]));\n      if (!s || RANK[h.status] > RANK[s.status] || (h.thread || []).length > (s.thread || []).length) { s = h; saveState(s); }\n    } catch (e) {}\n  }\n  applyPeople(s);\n  return s;\n}\n\nfunction saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }\nfunction stateLink(page, s) { return page + \"#s=\" + encodeURIComponent(JSON.stringify(s)); }\n\n// Call cb whenever another tab changes the shared state; reload if the demo was reset\nfunction onStateChange(cb) {\n  window.addEventListener(\"storage\", function (e) {\n    if (e.key !== STORE_KEY && e.key !== null) return;\n    var s = readStore();\n    if (!s) location.reload();\n    else cb(s);\n  });\n}\n\n// Change the shared state in place (always starting from the latest copy) and save it\n// (base: this page's copy, used if storage is unavailable, e.g. opened from a link)\nfunction update(fn, base) {\n  var s = readStore() || base;\n  if (!s) return null;\n  fn(s);\ xOf(o.pick) > -1) { el.classList.add(\"on\"); el.querySelector(\".cf-box\").textContent = \"✓\"; } });\n    m.querySelector(\".cf-sign\").innerHTML = 'Prescriber signature <span class=\"sig small draw\">' + o.prescriber.split(\" \").pop() + '<\/span> Date ' + new Date().toLocaleDateString();\n    $(\"cf-out\").innerHTML = '<div class=\"verdict\">✓ ' + o.prescriber + ' ticked <b>' + op[0] + '<\/b> ' + op[1] + ' and signed' + (via === \"fax\" ? \" · fax received, AI read the tick\" : \"\") + '<\/div><button type=\"button\" class=\"btn\" data-x>Use this<\/button>';\n    o.onDone(op, via === \"fax\" ? \"fax \" + D.fax : \"Linkt\");\n  });\n}\n\n// ---------- Simple info sheet (used by menu items that show a list or report) ----------\nfunction infoSheet(title, html) {\n  var m = document.createElement(\"div\");\n  m.className = \"modal\";\n  m.innerHTML = '<div class=\"modal-card wide\"><button class=\"chat-x\" data-x type=\"button\">×<\/button><h2 class=\"ms-h\">' + title + '<\/h2>' + html + '<button class=\"btn\" data-x type=\"button\">Close<\/button><\/div>';\n  m.addEventListener(\"click\", function (e) { if (e.target === m || e.target.closest(\"[data-x]\")) m.remove(); });\n  document.body.appendChild(m);\n  return m;\n}\n"};
var FONTS = "<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Homemade+Apple&display=swap\" rel=\"stylesheet\">";
var PATCH = "\ndocument.addEventListener(\"click\", function (e) {\n  var a = e.target.closest && e.target.closest(\"a[href]\");\n  if (!a) return;\n  var m = (a.getAttribute(\"href\") || \"\").match(/^([a-z]+)\\.html/);\n  if (!m) return;\n  e.preventDefault(); e.stopPropagation();\n  parent.postMessage({ linktOpen: m[1] }, \"*\");\n}, true);\n";
var SHIM = "\n(function () {\n  // Each screen keeps its own copy of the shared data and stays in sync with the others\n  // by messages through the page. Works even where browser storage or frame access is blocked.\n  var SNAP = window.__LINKT_SNAP || { local: {}, session: {} };\n  function mk(area) {\n    var map = SNAP[area] || {};\n    function send(k, v) { try { window.parent.postMessage({ linktSet: 1, area: area, k: k, v: v }, \"*\"); } catch (e) {} }\n    return {\n      getItem: function (k) { return Object.prototype.hasOwnProperty.call(map, k) ? map[k] : null; },\n      setItem: function (k, v) { v = String(v); map[k] = v; send(k, v); },\n      removeItem: function (k) { delete map[k]; send(k, null); },\n      clear: function () { Object.keys(map).forEach(function (k) { delete map[k]; send(k, null); }); },\n      key: function (i) { return Object.keys(map)[i] || null; },\n      get length() { return Object.keys(map).length; },\n      _apply: function (k, v) { if (v === null) delete map[k]; else map[k] = v; }\n    };\n  }\n  var L = mk(\"local\"), S = mk(\"session\");\n  try {\n    Object.defineProperty(window, \"localStorage\", { value: L, configurable: true });\n    Object.defineProperty(window, \"sessionStorage\", { value: S, configurable: true });\n  } catch (e) {}\n  window.addEventListener(\"message\", function (e) {\n    var d = e.data;\n    if (!d || !d.linktSync) return;\n    var st = d.area === \"local\" ? L : S, old = st.getItem(d.k);\n    st._apply(d.k, d.v);\n    if (d.area === \"local\") { try { window.dispatchEvent(new StorageEvent(\"storage\", { key: d.k, oldValue: old, newValue: d.v })); } catch (x) {} }\n  });\n})();\n";

// ---------- One shared store for every screen ----------
// Uses the browser's storage when allowed (so data survives a refresh); otherwise keeps it in memory,
// which is what makes the file work inside previews, email/file viewers and locked-down browsers.
var REAL = null;
try { REAL = window.localStorage; REAL.setItem("__linkt_t", "1"); REAL.removeItem("__linkt_t"); } catch (e) { REAL = null; }
var MAPS = { local: {}, session: {} };
if (REAL) { for (var i = 0; i < REAL.length; i++) { var k0 = REAL.key(i); if (k0 && k0.indexOf("linkt-") === 0) MAPS.local[k0] = REAL.getItem(k0); } }
// Hub: a screen changed something → save it here and tell every other screen
window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || !d.linktSet) return;
  var map = MAPS[d.area];
  if (d.v === null) delete map[d.k]; else map[d.k] = d.v;
  if (d.area === "local" && REAL) { try { if (d.v === null) REAL.removeItem(d.k); else REAL.setItem(d.k, d.v); } catch (x) {} }
  Object.keys(frames).forEach(function (n) {
    var w = frames[n].querySelector("iframe").contentWindow;
    if (w && w !== e.source) w.postMessage({ linktSync: 1, area: d.area, k: d.k, v: d.v }, "*");
  });
  if (d.k === "linkt-edition") setTimeout(reloadAll, 50);
});
var ORDER = Object.keys(PAGES);
var frames = {}, wide = window.innerWidth >= 1000, visible = wide ? ["prescribe", "pharmacy"] : ["prescribe"], split = wide;

function doc(name) {
  var p = PAGES[name];
  return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + p.title + '</title>' + FONTS +
    '<style>' + COMMON.css + '</style></head><body class="' + p.cls + '">' + p.body +
    '<script>window.__LINKT_SNAP=' + JSON.stringify(MAPS).replace(/<\//g, "<\\/") + ';<\/script><script>' + SHIM + '<\/script><script>' + COMMON.data + '<\/script><script>' + COMMON.shared + '<\/script><script>' + PATCH + '<\/script><script>' + p.js + '<\/script></body></html>';
}
function pane(name) {
  if (frames[name]) return frames[name];
  var p = PAGES[name], d = document.createElement("div");
  d.className = "pane" + (p.phone ? " phone" : "");
  d.innerHTML = '<div class="pane-h"><span>' + p.ic + ' ' + p.label + '</span><button title="Reload this screen">↻</button></div>';
  var f = document.createElement("iframe");
  f.title = p.label;
  f.srcdoc = doc(name);
  d.appendChild(f);
  d.querySelector("button").onclick = function () { f.srcdoc = doc(name); };
  frames[name] = d;
  return d;
}
function render() {
  var st = document.getElementById("stage");
  st.className = "stage" + (split ? "" : " single");
  Array.prototype.slice.call(st.children).forEach(function (c) { c.style.display = "none"; });
  visible.forEach(function (n) { var d = pane(n); if (d.parentNode !== st) st.appendChild(d); d.style.display = ""; st.appendChild(d); });
  document.getElementById("tabs").innerHTML = ORDER.map(function (n) {
    var on = visible.indexOf(n) !== -1;
    return '<button data-n="' + n + '" class="' + (on ? (split ? "on side" : "on") : "") + '">' + PAGES[n].ic + ' ' + PAGES[n].label + '</button>';
  }).join("");
  document.getElementById("split").classList.toggle("on", split);
  document.getElementById("hint").textContent = split ? "Tap tabs to add or remove (up to 3)" : "";
}
function open(n) {
  if (!PAGES[n]) return;
  if (!split) visible = [n];
  else if (visible.indexOf(n) === -1) { visible.push(n); if (visible.length > 3) visible.shift(); }
  render();
}
document.getElementById("tabs").addEventListener("click", function (e) {
  var b = e.target.closest("[data-n]");
  if (!b) return;
  var n = b.dataset.n;
  if (split && visible.indexOf(n) !== -1 && visible.length > 1) { visible.splice(visible.indexOf(n), 1); render(); return; }
  open(n);
});
document.getElementById("split").addEventListener("click", function () {
  split = !split;
  if (split && visible.length === 1) visible = visible[0] === "pharmacy" ? ["prescribe", "pharmacy"] : [visible[0], "pharmacy"];
  if (!split) visible = [visible[visible.length - 1]];
  render();
});
function reloadAll() { Object.keys(frames).forEach(function (n) { frames[n].querySelector("iframe").srcdoc = doc(n); }); }
document.getElementById("reset").addEventListener("click", function () {
  try {
    Object.keys(MAPS.local).filter(function (k) { return k !== "linkt-edition"; }).forEach(function (k) { delete MAPS.local[k]; if (REAL) try { REAL.removeItem(k); } catch (e) {} });
    MAPS.session = {};
  } catch (e) {}
  reloadAll();
});
// A screen asked to open another screen (e.g. "Open ↗" on the start page)
window.addEventListener("message", function (e) { if (e.data && e.data.linktOpen) open(e.data.linktOpen); });
render();
</script>
